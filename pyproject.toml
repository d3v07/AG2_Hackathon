[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concord-lite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ag2[openai,daytona]>=0.12",
    "falkordb>=1.0.10",
    "opentelemetry-sdk>=1.41,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.41,<2",
    "python-dotenv",
    "PyYAML>=6.0",
    "tavily-python",
    "fastapi==0.136.1",
    "pydantic==2.13.4",
    "sqlmodel==0.0.38",
    "uvicorn==0.38.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "graph*", "shared*", "zone_a*", "zone_b*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external APIs (LLM, Daytona, Tavily)",
    "live_smoke: end-to-end smoke against a real backend; opt-in via -m live_smoke",
]
