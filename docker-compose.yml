services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      CONCORD_DB_PATH: /app/data/concord.db
      CONCORD_GRAPH_ENABLED: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      - concord-data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  falkordb:
    image: falkordb/falkordb@sha256:aaf67c724bba36b9fb8d43a2671fd57e89c536b971d72b692a63a168c8053ff4
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  concord-data:
  falkordb-data:
