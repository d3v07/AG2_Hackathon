<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>Concord Lite — Contract-to-Repair for AG2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --ink-1: #14161c;
  --ink-2: #3b424d;
  --ink-3: #6b7280;
  --ink-4: #9aa3ad;
  --line: #e6e8ec;
  --line-2: #eef0f3;
  --bg: #f7f8fa;
  --bg-2: #ffffff;
  --bg-soft: #fbfbfc;

  --brand: #3358e6;
  --brand-ink: #1f3bb5;
  --brand-soft: #eaf0ff;

  --agent: #6446c6;
  --agent-soft: #efeafd;

  --warn: #b86509;
  --warn-soft: #fdf3e3;

  --danger: #c82a2a;
  --danger-ink: #8a1f1f;
  --danger-soft: #fbeaea;

  --success: #0f7a4a;
  --success-soft: #e6f3ec;

  --human: #0a7882;
  --human-soft: #def0f2;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow-1: 0 1px 0 rgba(20,22,28,.04), 0 1px 2px rgba(20,22,28,.04);
  --shadow-2: 0 1px 0 rgba(20,22,28,.05), 0 6px 24px -10px rgba(20,22,28,.12);
}

/* ============================================================
   RESET + BASE
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink-1);
  font: 14px/1.45 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
button { font-family: inherit; cursor: pointer; }
textarea { font-family: inherit; }
a { color: var(--brand); }

/* ============================================================
   APP SHELL
============================================================ */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: 52px 1fr 40px;
}
.app.density-compact .page { padding: 12px 16px; }

/* ============================================================
   TOP BAR
============================================================ */
.top {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 260px 1fr auto;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.brand-mark { display: flex; gap: 10px; align-items: center; }
.logo {
  width: 28px; height: 28px; border-radius: 7px;
  background: #14161c;
  color: white; display: grid; place-items: center;
  font-size: 15px; flex-shrink: 0;
}
.brand-text .name { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; line-height: 1.2; }
.brand-text .name .lite { color: var(--ink-3); font-weight: 400; }
.brand-text .tagline { font-size: 10.5px; color: var(--ink-4); letter-spacing: 0.02em; margin-top: 1px; }

.screen-nav {
  display: flex; gap: 2px; justify-self: center;
  background: var(--bg); padding: 3px; border-radius: 8px;
  border: 1px solid var(--line);
}
.screen-tab {
  display: flex; align-items: center; gap: 5px;
  background: transparent; border: 0; padding: 4px 9px; border-radius: 6px;
  color: var(--ink-3); font-size: 12px; white-space: nowrap;
}
.screen-tab .num { font-size: 10px; font-family: 'JetBrains Mono', monospace; opacity: 0.6; }
.screen-tab:hover { color: var(--ink-1); background: var(--bg-soft); }
.screen-tab.active { background: white; color: var(--ink-1); box-shadow: var(--shadow-1); font-weight: 500; }

.top-actions { display: flex; gap: 8px; align-items: center; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--agent); color: white;
  display: grid; place-items: center; font-size: 11px; font-weight: 600; flex-shrink: 0;
}
.density-btn {
  background: transparent; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 3px 8px; font-size: 11px; color: var(--ink-3);
}
.density-btn:hover { background: var(--bg); }

/* ============================================================
   TRANSPORT BAR
============================================================ */
.transport {
  background: var(--bg-2); border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; padding: 0 20px;
  font-size: 12px; height: 44px;
}
.play-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2);
  display: grid; place-items: center; font-size: 11px;
  color: var(--ink-1);
}
.play-btn:hover { background: var(--bg); }
.t-cur { font-family: 'JetBrains Mono', monospace; font-size: 12px; min-width: 44px; color: var(--ink-2); }
.bar {
  flex: 1; height: 6px; background: var(--line-2); border-radius: 3px;
  position: relative; cursor: pointer;
}
.bar-fill { height: 100%; background: var(--brand); border-radius: 3px; transition: width 0.1s linear; }
.bar-marker {
  position: absolute; top: -3px; width: 2px; height: 12px;
  background: var(--danger); border-radius: 1px; transform: translateX(-1px);
}
.bar-marker.warn-marker { background: var(--warn); }
.t-tot { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-4); }
.speed { display: flex; gap: 2px; }
.sp-btn {
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 6px; font-size: 11px; color: var(--ink-3);
}
.sp-btn.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.sp-btn:hover { background: var(--bg); }
.reset-btn {
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 7px; font-size: 11px; color: var(--ink-3);
}
.reset-btn:hover { background: var(--bg); }

/* ============================================================
   FLOW RAIL
============================================================ */
.foot {
  background: var(--bg-2); border-top: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 20px;
  position: sticky; bottom: 0; z-index: 50;
}
.flow-rail { display: flex; align-items: center; gap: 0; width: 100%; }
.rail-step {
  display: flex; align-items: center; gap: 5px;
  background: transparent; border: 0; padding: 4px 8px; border-radius: var(--radius-sm);
  color: var(--ink-4); font-size: 11px; white-space: nowrap;
}
.rail-step .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); flex-shrink: 0;
}
.rail-step.reached .dot { background: var(--brand); }
.rail-step.reached { color: var(--ink-2); }
.rail-step.current .dot {
  background: var(--brand);
  animation: pulse-dot 1.4s ease-in-out infinite;
}
.rail-step.current { color: var(--brand); font-weight: 500; }
.rail-step:hover { background: var(--bg); }
.rail-gap { flex: 1; height: 1px; background: var(--line-2); max-width: 24px; }
.rail-gap.reached { background: var(--brand-soft); }
@keyframes pulse-dot {
  0%, 100% { opacity: 0.5; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}

/* ============================================================
   MAIN CONTENT
============================================================ */
.main { overflow-y: auto; }
.page { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.page-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
}
.crumbs { font-size: 11px; color: var(--ink-4); margin-bottom: 6px; letter-spacing: 0.01em; }
.crumbs .sep { margin: 0 4px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
h3 { font-size: 14px; font-weight: 600; }
.eyebrow {
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-4); margin-bottom: 4px;
}

/* ============================================================
   CARDS
============================================================ */
.card {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-1);
  display: flex; flex-direction: column;
}
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--line-2);
}
.card-body { padding: 16px; flex: 1; }
.card-body.tight { padding: 12px; }
.card-foot {
  padding: 10px 16px; border-top: 1px solid var(--line-2);
  background: var(--bg-soft); border-radius: 0 0 var(--radius) var(--radius);
}
.col { display: flex; flex-direction: column; gap: 12px; }

/* ============================================================
   GRID LAYOUTS
============================================================ */
.grid { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.tight { gap: 6px; }
.row.between { justify-content: space-between; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.w-full { width: 100%; }

/* ============================================================
   PILLS + TAGS
============================================================ */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 500;
  background: var(--line-2); color: var(--ink-2); white-space: nowrap;
  border: 1px solid transparent;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.brand { background: var(--brand-soft); color: var(--brand-ink); }
.pill.agent { background: var(--agent-soft); color: var(--agent); }
.pill.danger { background: var(--danger-soft); color: var(--danger-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok, .pill.success { background: var(--success-soft); color: var(--success); }
.pill.human { background: var(--human-soft); color: var(--human); }
.pill.live { background: var(--brand-soft); color: var(--brand); }
.pill.live .dot { animation: pulse-dot 1s ease-in-out infinite; }
.sev-high { background: var(--danger-soft); color: var(--danger-ink); }
.sev-medium { background: var(--warn-soft); color: var(--warn); }
.sev-low { background: var(--line-2); color: var(--ink-3); }

.tag {
  display: inline-flex; align-items: center;
  padding: 2px 7px; border-radius: var(--radius-sm); font-size: 11px;
  background: var(--bg); color: var(--ink-3); border: 1px solid var(--line);
}

/* ============================================================
   METRICS
============================================================ */
.metric {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;
}
.metric .k { font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: 0.05em; }
.metric .v { font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.metric .v.sm { font-size: 15px; }
.metric .x { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.metric.fail { border-color: var(--danger); background: var(--danger-soft); }
.metric.fail .v { color: var(--danger-ink); }
.metric.warn { border-color: #e8b36a; background: var(--warn-soft); }
.metric.warn .v { color: var(--warn); }
.metric.ok { border-color: #7dd4ac; background: var(--success-soft); }
.metric.ok .v { color: var(--success); }
.metric.brand { border-color: #a8b8f8; background: var(--brand-soft); }
.metric.brand .v { color: var(--brand-ink); }
.metric.human { border-color: #8dd4d8; background: var(--human-soft); }
.metric.human .v { color: var(--human); }

/* ============================================================
   FRAMES
============================================================ */
.frame {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.frame.expected { background: var(--success-soft); border-color: #9dd4b8; }
.frame.observed { background: var(--danger-soft); border-color: #e8a8a8; }

/* ============================================================
   BANNER
============================================================ */
.banner {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius); border: 1px solid;
}
.banner.danger { background: var(--danger-soft); border-color: #e8a8a8; }
.banner.warn { background: var(--warn-soft); border-color: #e8c88a; }
.banner-ic {
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px;
  font-weight: 700; flex-shrink: 0;
}
.banner.danger .banner-ic { background: var(--danger); color: white; }
.banner.warn .banner-ic { background: var(--warn); color: white; }
.banner-text { flex: 1; }
.banner-text .t { font-weight: 600; font-size: 13.5px; }
.banner-text .s { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }

/* ============================================================
   BUTTONS
============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--ink-1);
  font-weight: 500; white-space: nowrap; transition: background 0.1s;
}
.btn:hover { background: var(--bg); }
.btn.brand { background: var(--brand); border-color: var(--brand); color: white; }
.btn.brand:hover { background: var(--brand-ink); }
.btn.success { background: var(--success); border-color: var(--success); color: white; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: white; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-3); }
.btn.ghost:hover { background: var(--bg); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============================================================
   CODE BLOCKS + DIFF
============================================================ */
.code {
  background: #1a1d24; border-radius: var(--radius-sm);
  padding: 12px; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; line-height: 1.6; display: flex; flex-direction: column;
  overflow-x: auto;
}
.code span { display: block; }
.code .ctx { color: #8892a4; }
.code .hi { color: #c8d8ff; background: rgba(51,88,230,0.15); padding: 0 4px; margin: 0 -4px; border-radius: 2px; }
.code .add { color: #7dd4ac; background: rgba(15,122,74,0.15); padding: 0 4px; margin: 0 -4px; border-radius: 2px; }
.code .del { color: #f08080; background: rgba(200,42,42,0.15); padding: 0 4px; margin: 0 -4px; border-radius: 2px; }

/* ============================================================
   TRACE LIST
============================================================ */
.trace { display: flex; flex-direction: column; gap: 1px; }
.trace-row {
  display: grid; grid-template-columns: 48px 64px 130px 1fr;
  gap: 8px; align-items: center; padding: 5px 8px; border-radius: 4px;
  font-size: 12px;
}
.trace-row:hover { background: var(--bg); }
.trace-row .t { font-family: 'JetBrains Mono', monospace; color: var(--ink-4); font-size: 11px; }
.trace-row .who { font-weight: 500; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-row .msg { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-row.row-violation { background: var(--danger-soft); }
.trace-row.row-violation .msg { color: var(--danger-ink); }
.trace-row.row-tool { background: var(--brand-soft); }
.trace-row.row-handoff { background: var(--agent-soft); }
.trace-row.row-diag { background: var(--brand-soft); }
.trace-row.row-guard, .trace-row.row-block, .trace-row.row-term { background: var(--warn-soft); }
.trace-row.pending { opacity: 0.5; }
.cursor { animation: blink 1s step-end infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ============================================================
   CTX VARS
============================================================ */
.ctx-grid { display: flex; flex-direction: column; gap: 2px; }
.ctx-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 8px; border-radius: 4px; font-size: 12px;
}
.ctx-row .k { font-family: 'JetBrains Mono', monospace; color: var(--ink-3); font-size: 11px; }
.ctx-row .v { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
.ctx-row.bad { background: var(--danger-soft); }
.ctx-row.bad .v { color: var(--danger-ink); }
.ctx-row.ok { background: var(--success-soft); }
.ctx-row.ok .v { color: var(--success); }
.ctx-row.warn { background: var(--warn-soft); }
.ctx-row.warn .v { color: var(--warn); }

/* ============================================================
   VIOLATIONS LIST
============================================================ */
.violations { display: flex; flex-direction: column; gap: 6px; }
.violation-row {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px; text-align: left; width: 100%;
  cursor: pointer; transition: border-color 0.1s;
}
.violation-row:hover:not(:disabled) { border-color: var(--brand); }
.violation-row.selected { border-color: var(--brand); background: var(--brand-soft); }
.violation-row:disabled { cursor: default; opacity: 0.5; }
.violation-row .vid { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-4); }
.violation-row .vt { font-size: 12.5px; font-weight: 500; color: var(--ink-1); }

/* ============================================================
   SPEC LISTS
============================================================ */
.spec { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.spec li { font-size: 12.5px; padding-left: 16px; position: relative; color: var(--ink-2); }
.spec li::before { content: "·"; position: absolute; left: 4px; color: var(--ink-4); }
.spec li.dot::before { content: "✓"; color: var(--success); }
.spec li.x::before { content: "✕"; color: var(--danger); }
.spec li.q::before { content: "○"; color: var(--warn); }

/* ============================================================
   TYPOGRAPHY HELPERS
============================================================ */
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11px; }
b { font-weight: 600; }
.label-cap {
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-4); display: block; margin-bottom: 4px;
}

/* ============================================================
   SPONSORS
============================================================ */
.sponsors { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp {
  font-size: 10.5px; font-weight: 500; padding: 2px 7px;
  border: 1px solid var(--line); border-radius: 4px;
  color: var(--ink-3); background: var(--bg-2);
}

/* ============================================================
   WORKFLOW NODE (rounded rect, agent tokens)
============================================================ */
.wf-node-rect {
  fill: var(--agent-soft); stroke: var(--agent); stroke-width: 1.5;
}
.wf-node-rect.active-node {
  stroke: var(--agent);
  animation: node-pulse-agent 1.4s ease-in-out infinite;
}
.wf-node-rect.done-node { fill: var(--success-soft); stroke: #7dd4ac; stroke-width: 1; }
.wf-node-rect.failed-node { fill: var(--danger-soft); stroke: var(--danger); }
.wf-node-rect.skipped-node { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; }
.wf-node-rect.idle-node { fill: var(--bg-soft); stroke: var(--line); stroke-width: 1; }
.wf-node-rect.human-node { fill: var(--human-soft); stroke: var(--human); stroke-width: 1.5; }
@keyframes node-pulse-agent {
  0%, 100% { stroke-opacity: 0.5; }
  50% { stroke-opacity: 1; }
}

/* ============================================================
   DIAGNOSTIC NODE (pill, brand tokens)
============================================================ */
.diag-node-pill {
  fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.5;
}
.diag-node-pill.active-diag {
  animation: node-pulse-brand 1.4s ease-in-out infinite;
}
@keyframes node-pulse-brand {
  0%, 100% { stroke-opacity: 0.5; }
  50% { stroke-opacity: 1; }
}

/* ============================================================
   OBSERVED RUN FRAME
============================================================ */
.observed-run-frame {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg-soft); padding: 8px;
}
.observed-run-eyebrow {
  font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--agent); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.observed-run-eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--agent); flex-shrink: 0;
}

/* ============================================================
   DIAGNOSTIC SESSION EYEBROW (floats above, not in a frame)
============================================================ */
.diagnostic-eyebrow {
  font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--brand); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.diagnostic-eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
  flex-shrink: 0; animation: pulse-dot 1.4s ease-in-out infinite;
}

/* ============================================================
   SVG GRAPH WRAPPERS
============================================================ */
.wf-wrap { width: 100%; overflow-x: auto; }
.wf-svg { width: 100%; height: auto; display: block; }

/* ============================================================
   FLOW STRIP (overview)
============================================================ */
.flow-strip { display: flex; align-items: center; gap: 0; flex-wrap: wrap; row-gap: 8px; }
.flow-beat {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg-2); font-size: 12px;
}
.flow-beat .n {
  width: 18px; height: 18px; border-radius: 50%; background: var(--brand-soft);

<script type="text/babel">
/* ============================================================

  routing: "Critic must hand off to Verifier before Reporter.",

};

const TRACE = [
  { id: "e01", t: 0.00, agent: "System",      type: "run.start",        text: "run_041 started for Literature Review Assistant", ctx: { approval_status: "pending", verified_sources_count: 0 } },
  { id: "e02", t: 0.38, agent: "Researcher",  type: "agent.message",    text: "Researcher collected 6 candidate papers for agentic workflow repair.", ctx: { current_agent: "Researcher" } },
  { id: "e03", t: 0.91, agent: "Critic",      type: "agent.message",    text: "Critic requested verification before report.", ctx: { current_agent: "Critic", last_handoff: "Researcher → Critic" } },
  { id: "e04", t: 1.24, agent: "Router",      type: "handoff",          text: "Router selected handoff Critic → Reporter.", violationId: "v03", ctx: { last_handoff: "Critic → Reporter" } },
  { id: "e05", t: 1.72, agent: "Verifier",    type: "agent.message",    text: "Verifier said sources were checked.", violationId: "v02", ctx: { current_agent: "Verifier", tool_events_seen: 0 } },
  { id: "e06", t: 2.10, agent: "Reporter",    type: "agent.message",    text: "Reporter wrote final output at t=2.10.", violationId: "v01", ctx: { current_agent: "Reporter", verified_sources_count: 0 } },
  { id: "e07", t: 2.82, agent: "ActionAgent", type: "action.reachable", text: "ActionAgent became reachable while approval_status was pending.", violationId: "v04", ctx: { approval_status: "pending" } },
  { id: "e08", t: 4.22, agent: "System",      type: "run.end",          text: "run_041 completed with contract violations.", ctx: { final_output_status: "unsafe" } },
];

const VIOLATIONS = [
  { id: "v01", title: "Missing evidence before report",      severity: "high",   agent: "Reporter",     step: "e06", appearsAt: 2.10, contract: "Evidence",  expected: "Reporter may run only when verified_sources_count >= 2.", observed: "Reporter ran with verified_sources_count = 0.", evidence_event_ids: ["e06"], confidence: 0.94 },
  { id: "v02", title: "Tool claim without tool event",       severity: "high",   agent: "Verifier",     step: "e05", appearsAt: 1.72, contract: "Tool",       expected: "A claim of source checking must map to a Tavily or Daytona event.", observed: "Verifier said sources were checked, but tool_events_seen = 0.", evidence_event_ids: ["e05"], confidence: 0.91 },
  { id: "v03", title: "Skipped verifier route",              severity: "medium", agent: "Router",       step: "e04", appearsAt: 1.24, contract: "Routing",    expected: "Critic → Verifier → Reporter.", observed: "Critic → Reporter.", evidence_event_ids: ["e03","e04"], confidence: 0.88 },
  { id: "v04", title: "Side effect reachable without approval", severity: "high", agent: "ActionAgent", step: "e07", appearsAt: 2.82, contract: "Approval",   expected: "ActionAgent is unreachable until approval_status = approved.", observed: "ActionAgent reachable while approval_status = pending.", evidence_event_ids: ["e07"], confidence: 0.96 },
];

const REPAIR = {
  primitive: "OnContextCondition + HumanGate + Guardrail",
  summary: "Patch routing so Critic must pass through Verifier, Reporter requires evidence, and ActionAgent is gated by approval.",
  diff: [
    "- handoff(Critic, Reporter)",
    "+ handoff(Critic, Verifier)",
    "+ handoff(Verifier, Reporter, condition: verified_sources_count >= 2)",
    "+ guardrail(Reporter, requires: citations.length >= 2)",
    "- allow(ActionAgent)",
    "+ allow(ActionAgent, condition: approval_status === 'approved')"
  ],
  expectedImpact: "Prevents premature reports, unsupported verifier claims, skipped verification, and side effects before human approval."
};

const TEST = {
  name: "test_lit_review_contract_repair_run_041",
  status: "pass",
  code: `def test_lit_review_contract_repair_run_041(trace, contract):
    assert route_contains(trace, ["Critic", "Verifier", "Reporter"])
    assert reporter_context(trace)["verified_sources_count"] >= 2
    assert verifier_tool_claims_have_events(trace, tools=["Tavily", "Daytona"])
    assert not action_reachable(trace, when={"approval_status": "pending"})`,
  assertions: [
    "Route includes Critic → Verifier → Reporter",
    "Reporter requires verified_sources_count >= 2",
    "Verifier tool claims require Tavily or Daytona events",
    "ActionAgent blocked while approval_status is pending",
  ],
  daytona_stdout: [
    "$ pytest tests/test_run_041_contract.py -q",
    "collected 1 item",
    "tests/test_run_041_contract.py .",
    "1 passed in 0.41s",
  ]
};

const TOTAL_T = 10.5;

/* ============================================================
   DEMO CLOCK HOOK
============================================================ */
const { useState, useEffect, useRef } = React;

function useDemoClock() {
  const [tNow, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [speed, setSpeed] = useState(1);
  const raf = useRef();
  const last = useRef(performance.now());

  useEffect(() => {
    function tick(now) {
      const dt = (now - last.current) / 1000;
      last.current = now;
      if (playing) {
        setT(t => {
          const nt = t + dt * speed;
          return nt > TOTAL_T + 0.5 ? 0 : nt;
        });
      }
      raf.current = requestAnimationFrame(tick);
    }
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [playing, speed]);

  const visibleTrace = TRACE.filter(e => e.t <= tNow);
  const visibleViolations = VIOLATIONS.filter(v => tNow >= v.appearsAt);
  return { tNow, visibleTrace, visibleViolations, playing, setPlaying, speed, setSpeed, setT };
}

/* ============================================================
   PRIMITIVE: Sponsors
============================================================ */
function Sponsors() {
  return (
    <div className="sponsors">
      <span className="muted tiny">tools</span>
      {["AG2","Tavily","Daytona","V0","Gemini"].map(s => <span className="sp" key={s}>{s}</span>)}
    </div>

}

/* ============================================================
   PRIMITIVE: CtxVars
============================================================ */
function CtxVars({ tNow }) {
  const vars = [
    { k: "workflow_id",           v: "lit-review-assistant" },
    { k: "run_id",                v: "run_041" },
    { k: "verified_sources_count", v: tNow < 2.10 ? "0" : "0", bad: tNow >= 2.10 },
    { k: "approval_status",       v: "pending", warn: true },
    { k: "current_agent",         v: tNow < 0.38 ? "—" : tNow < 0.91 ? "Researcher" : tNow < 1.24 ? "Critic" : tNow < 2.10 ? "Verifier" : tNow < 2.82 ? "Reporter" : "ActionAgent" },
    { k: "last_handoff",          v: tNow < 0.91 ? "—" : tNow < 1.24 ? "Researcher → Critic" : "Critic → Reporter", bad: tNow >= 1.24 },
    { k: "tool_events_seen",      v: tNow < 1.72 ? "0" : "0", bad: tNow >= 1.72 },
  ];
  return (
    <div className="ctx-grid">
      {vars.map(v => (
        <div className={`ctx-row ${v.bad ? "bad" : v.ok ? "ok" : v.warn ? "warn" : ""}`} key={v.k}>
          <span className="k">{v.k}</span>
          <span className="v">{v.v}</span>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   PRIMITIVE: TraceList
============================================================ */
function TraceList({ tNow, maxItems = 12 }) {
  const items = TRACE.filter(e => e.t <= tNow).slice(-maxItems);
  return (
    <div className="trace">
      {items.map(e => {
        const isViolation = !!e.violationId;
        const cls = isViolation ? "row-violation"
          : e.type === "handoff" ? "row-handoff"
          : e.type.startsWith("agent") ? ""
          : e.type === "run.start" || e.type === "run.end" ? "row-diag"
          : "";
        const tag = e.type === "handoff" ? "handoff"
          : e.type === "agent.message" ? "turn"
          : e.type === "action.reachable" ? "action"
          : e.type === "run.start" ? "start"
          : e.type === "run.end" ? "end"
          : "event";
        return (
          <div className={`trace-row ${cls}`} key={e.id}>
            <span className="t">t={e.t.toFixed(2)}</span>
            <span className="tag">{tag}</span>
            <span className="who">{e.agent}</span>
            <span className="msg">{e.text}</span>
          </div>
        );
      })}
      {tNow < TOTAL_T && (
        <div className="trace-row pending">
          <span className="t">…</span>
          <span className="tag">live</span>
          <span className="who muted">awaiting event</span>
          <span className="cursor">▍</span>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   PRIMITIVE: ViolationsList
============================================================ */

        return (
          <button

              <span className="muted tiny">{active ? `t=${v.appearsAt.toFixed(2)}s` : "…"}</span>

          </button>
        );
      })}
    </div>
  );
}

/* ============================================================
   PRIMITIVE: WorkflowGraph (SVG, rounded rect nodes, solid arrows)
============================================================ */
function WorkflowGraph({ tNow }) {
  const W = 680, H = 260;
  const NW = 116, NH = 70;
  // layout: 5 agents in a roughly linear path with verifier offset
  const positions = {
    Researcher:  { x: 20,  y: 20 },
    Critic:      { x: 20,  y: 145 },
    Verifier:    { x: 200, y: 80 },
    Reporter:    { x: 380, y: 20 },
    ActionAgent: { x: 380, y: 145 },
  };
  const humanGateX = 290, humanGateY = 145;

  function nodeState(name) {
    if (name === "Verifier" && tNow >= 1.24) return "skipped";
    if (name === "Reporter" && tNow >= 2.10) return "failed";
    if (name === "ActionAgent" && tNow >= 2.82) return "blocked";
    if (name === "Researcher" && tNow >= 0.38 && tNow < 0.91) return "active";
    if (name === "Critic" && tNow >= 0.91 && tNow < 1.24) return "active";
    if (name === "Reporter" && tNow >= 1.72 && tNow < 2.10) return "active";
    return "idle";
  }

  function nodeClass(state) {
    if (state === "active") return "wf-node-rect active-node";
    if (state === "failed") return "wf-node-rect failed-node";
    if (state === "skipped") return "wf-node-rect skipped-node";
    if (state === "blocked") return "wf-node-rect idle-node";
    return "wf-node-rect idle-node";
  }

  const handoffs = [
    { from: "Researcher", to: "Critic", label: "① retrieved>0", firedAt: 0.38, bad: false },
    { from: "Critic", to: "Verifier", label: "② expected", firedAt: null, bad: false, missed: true },
    { from: "Critic", to: "Reporter", label: "③ fallback", firedAt: 1.24, bad: true },
    { from: "Reporter", to: "ActionAgent", label: "④ approval req", firedAt: null, blocked: true },
  ];

  function center(name) {
    const p = positions[name];
    return { x: p.x + NW/2, y: p.y + NH/2 };
  }

  function arrowPath(from, to, curve = 0) {
    const a = center(from), b = center(to);
    const mx = (a.x + b.x)/2 + curve;
    const my = (a.y + b.y)/2;
    return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
  }

  return (
    <div className="wf-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="wf-svg" style={{ minHeight: 200 }}>
        <defs>
          <marker id="arr-agent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M 0 0 L 7 3.5 L 0 7 z" fill="var(--agent)" />
          </marker>
          <marker id="arr-danger" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M 0 0 L 7 3.5 L 0 7 z" fill="var(--danger)" />
          </marker>
          <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M 0 0 L 7 3.5 L 0 7 z" fill="var(--ink-4)" />
          </marker>
        </defs>

        {/* Edges */}
        {handoffs.map((h, i) => {
          const a = center(h.from), b = center(h.to);
          const fired = h.firedAt !== null && tNow >= h.firedAt;
          const bad = h.bad && fired;
          const missed = h.missed;
          const blocked = h.blocked;
          const stroke = bad ? "var(--danger)" : missed ? "var(--ink-4)" : fired ? "var(--agent)" : "var(--line)";
          const dash = (missed || blocked) ? "5 4" : null;
          const marker = bad ? "url(#arr-danger)" : missed ? "url(#arr-muted)" : "url(#arr-agent)";
          const curve = h.from === "Critic" && h.to === "Reporter" ? 40 : 0;
          const d = arrowPath(h.from, h.to, curve);
          return (
            <g key={i}>
              <path d={d} fill="none" stroke={stroke} strokeWidth={bad ? 2 : 1.5}
                strokeDasharray={dash} markerEnd={marker} opacity={missed ? 0.5 : 1}
              />
              <text
                x={(a.x + b.x)/2 + curve/2} y={(a.y + b.y)/2 - 6}
                textAnchor="middle" fontSize="9.5" fill={bad ? "var(--danger)" : "var(--ink-4)"}
                fontFamily="'JetBrains Mono',monospace"
              >{h.label}</text>
            </g>
          );
        })}

        {/* HumanGate before ActionAgent */}
        {tNow >= 0 && (
          <g transform={`translate(${humanGateX}, ${humanGateY})`}>
            <rect width={82} height={36} rx="18" className="wf-node-rect human-node" />
            <text x="41" y="14" textAnchor="middle" fontSize="9" fill="var(--human)" fontFamily="Inter" fontWeight="500">HumanGate</text>
            <text x="41" y="26" textAnchor="middle" fontSize="8.5" fill="var(--human)" fontFamily="'JetBrains Mono',monospace">UserProxy</text>
          </g>
        )}

        {/* Workflow agents */}
        {WORKFLOW.zoneAAgents.map(agent => {
          const p = positions[agent.name];
          if (!p) return null;
          const st = nodeState(agent.name);
          return (
            <g key={agent.name} transform={`translate(${p.x}, ${p.y})`}>
              <rect width={NW} height={NH} rx="8" className={nodeClass(st)} />
              <text x="10" y="18" fontSize="10" fill="var(--agent)" fontFamily="'JetBrains Mono',monospace" fontWeight="500">
                {agent.n}
              </text>
              <text x="24" y="18" fontSize="12" fill="var(--ink-1)" fontWeight="600" fontFamily="Inter">
                {agent.name}
              </text>
              <text x="10" y="32" fontSize="10" fill="var(--ink-3)" fontFamily="Inter">{agent.role}</text>
              <text x="10" y="46" fontSize="9.5" fill="var(--ink-4)" fontFamily="'JetBrains Mono',monospace">
                {agent.contracts.join(" · ")}
              </text>
              {st === "active" && (
                <text x="10" y="62" fontSize="9" fill="var(--agent)" fontFamily="'JetBrains Mono',monospace">● running</text>
              )}
              {st === "failed" && (
                <text x="10" y="62" fontSize="9" fill="var(--danger)" fontFamily="'JetBrains Mono',monospace">✕ blocked</text>
              )}
              {st === "skipped" && (
                <text x="10" y="62" fontSize="9" fill="var(--ink-4)" fontFamily="'JetBrains Mono',monospace">— skipped</text>
              )}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ============================================================
   PRIMITIVE: DiagnosticFlow (SVG, pill-shaped nodes, dashed probes, brand tokens)
============================================================ */
function DiagnosticFlow({ tNow }) {
  const W = 680, H = 110;
  const PW = 96, PH = 44; // pill dimensions
  const spacing = 108;
  const startX = 10;
  const y = 28;

  const diagActiveAt = [5.0, 6.0, 7.0, 8.0, 9.0, 9.5];

  return (
    <div className="wf-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="wf-svg" style={{ minHeight: 80 }}>
        <defs>
          <marker id="arr-brand" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M 0 0 L 7 3.5 L 0 7 z" fill="var(--brand)" />
          </marker>
        </defs>
        {/* Connecting dashed arrows between diagnostic agents */}
        {WORKFLOW.zoneBAgents.slice(0, -1).map((_, i) => {
          const ax = startX + i * spacing + PW;
          const bx = startX + (i+1) * spacing;
          const cy = y + PH/2;
          const fired = tNow >= diagActiveAt[i + 1];
          return (
            <line key={i}
              x1={ax} y1={cy} x2={bx} y2={cy}
              stroke={fired ? "var(--brand)" : "var(--line)"}
              strokeWidth="1" strokeDasharray="4 3"
              markerEnd={fired ? "url(#arr-brand)" : undefined}
            />
          );
        })}
        {/* Pill nodes */}
        {WORKFLOW.zoneBAgents.map((agent, i) => {
          const x = startX + i * spacing;
          const active = tNow >= diagActiveAt[i];
          return (
            <g key={agent.name} transform={`translate(${x}, ${y})`}>
              <rect width={PW} height={PH} rx={PH/2}
                className={`diag-node-pill ${active ? "active-diag" : ""}`}
                fill={active ? "var(--brand-soft)" : "var(--bg)"}
                stroke={active ? "var(--brand)" : "var(--line)"}
                strokeWidth={active ? 1.5 : 1}
              />
              <text x={PW/2} y={16} textAnchor="middle" fontSize="9" fill={active ? "var(--brand)" : "var(--ink-4)"} fontFamily="'JetBrains Mono',monospace" fontWeight="500">
                {agent.n}
              </text>
              <text x={PW/2} y={28} textAnchor="middle" fontSize="10" fill={active ? "var(--brand-ink)" : "var(--ink-4)"} fontFamily="Inter" fontWeight="500">
                {agent.name.length > 11 ? agent.name.slice(0,10)+"…" : agent.name}
              </text>
              <text x={PW/2} y={40} textAnchor="middle" fontSize="8.5" fill={active ? "var(--brand)" : "var(--ink-4)"} fontFamily="Inter">
                {agent.role.length > 16 ? agent.role.slice(0,15)+"…" : agent.role}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ============================================================
   SCREEN 0 — OVERVIEW

        </div>
        <div className="card-body">
          <div className="flow-strip">
            {["Upload run","Show contract","Run diagnostic","Detect violations","Attribute failure","Suggest repair","Generate test","Approve / revise","Final report"].map((b, i, arr) => (
              <React.Fragment key={i}>
                <div className="flow-beat">
                  <span className="n">{i+1}</span>

/* ============================================================
   SCREEN REGISTRY
============================================================ */
const SCREENS = [
  { id: 0, label: "Overview",        short: "00" },
  { id: 1, label: "Live Run",        short: "01" },
  { id: 2, label: "Workflow",        short: "02" },
  { id: 3, label: "Violation",       short: "03" },
  { id: 4, label: "Repair",          short: "04" },
  { id: 5, label: "Regression Test", short: "05" },
  { id: 6, label: "Final Report",    short: "06" },
];

const FLOW_BEATS = [
  "Upload run","Show contract","Run diagnostic","Detect violations",
  "Attribute failure","Suggest repair","Generate test","Approve / revise","Final report"
];

/* ============================================================
   APP
============================================================ */
function App() {
  const clock = useDemoClock();
  const [screen, setScreen] = useState(0);
  const [activeViolation, setActiveViolation] = useState("v01");
  const [density, setDensity] = useState("comfortable");
  const [autopilot, setAutopilot] = useState(true);

  // Autopilot — only advances when enabled; re-enables on loop reset
  useEffect(() => {
    if (!autopilot) return;
    const t = clock.tNow;
    let target = 0;
    if (t < 0.1)  target = 0;
    else if (t < 4.5)  target = 1;
    else if (t < 5.8)  target = 2;
    else if (t < 7.2)  target = 3;
    else if (t < 8.6)  target = 4;
    else if (t < 9.6)  target = 5;
    else               target = 6;
    setScreen(target);
  }, [Math.floor(clock.tNow * 2), autopilot]);

  // Re-enable autopilot when clock loops back to 0
  useEffect(() => {
    if (clock.tNow < 0.15) setAutopilot(true);
  }, [clock.tNow < 0.15]);

  function jump(n) { setAutopilot(false); setScreen(n); }

  const progress = Math.min(1, clock.tNow / TOTAL_T);
  const showTransport = screen >= 1 && screen <= 3;

  function beatReached(i) {
    if (i === 0) return true;
    if (i === 1) return clock.tNow > 0.05;
    if (i === 2) return clock.tNow > 4.5;
    if (i === 3) return clock.tNow > 5.5;
    if (i === 4) return clock.tNow > 6.8;
    if (i === 5) return clock.tNow > 8.0;
    if (i === 6) return clock.tNow > 9.0;
    if (i === 7) return clock.tNow > 9.5;
    if (i === 8) return clock.tNow > 9.8;
    return false;
  }

  const currentBeat = (() => {
    const t = clock.tNow;
    if (t < 0.05) return 0;
    if (t < 4.5)  return 1;
    if (t < 5.5)  return 2;
    if (t < 6.8)  return 3;
    if (t < 8.0)  return 4;
    if (t < 9.0)  return 5;
    if (t < 9.5)  return 6;
    if (t < 9.8)  return 7;
    return 8;
  })();

  const screenEl = (() => {
    const props = { clock, onJump: jump, activeViolation, onPickViolation: setActiveViolation };
    switch (screen) {
      case 0: return <S0 {...props} />;
      case 1: return <S1 {...props} />;
      case 2: return <S2 {...props} />;
      case 3: return <S3 {...props} />;
      case 4: return <S4 {...props} />;
      case 5: return <S5 {...props} />;
      case 6: return <S6 {...props} />;
      default: return <S0 {...props} />;
    }
  })();

  return (
    <div className={`app density-${density}`} style={{ gridTemplateRows: showTransport ? "52px 44px 1fr 40px" : "52px 1fr 40px" }}>
      {/* TOP BAR */}
      <header className="top">
        <div className="brand-mark">
          <div className="logo">◐</div>
          <div className="brand-text">
            <div className="name">Concord <span className="lite">Lite</span></div>
            <div className="tagline">contract-to-repair · AG2</div>
          </div>
        </div>

        <nav className="screen-nav">
          {SCREENS.map(s => (
            <button key={s.id} className={`screen-tab ${screen === s.id ? "active" : ""}`} onClick={() => jump(s.id)}>
              <span className="num">{s.short}</span>
              <span>{s.label}</span>
            </button>
          ))}
        </nav>

        <div className="top-actions">
          <button
            className="density-btn"
            style={autopilot ? { borderColor: "var(--brand)", color: "var(--brand)" } : {}}
            onClick={() => setAutopilot(a => !a)}
            title="Toggle autopilot"
          >
            {autopilot ? "● autopilot" : "○ autopilot"}
          </button>
          <button className="density-btn" onClick={() => setDensity(d => d === "comfortable" ? "compact" : "comfortable")}>
            {density === "comfortable" ? "compact" : "comfy"}
          </button>
          <div className="avatar">d3</div>
        </div>
      </header>

      {/* TRANSPORT BAR (screens 1–3) */}
      {showTransport && (
        <div className="transport">
          <button className="play-btn" onClick={() => clock.setPlaying(p => !p)}>
            {clock.playing ? "❚❚" : "▶"}
          </button>
          <div className="t-cur">{clock.tNow.toFixed(2)}s</div>
          <div className="bar">
            <div className="bar-fill" style={{ width: `${progress*100}%` }} />
            {VIOLATIONS.map(v => (
              <div key={v.id} className="bar-marker" title={v.title}
                style={{ left: `${(v.appearsAt / TOTAL_T) * 100}%` }} />
            ))}
          </div>
          <div className="t-tot">{TOTAL_T.toFixed(1)}s</div>
          <div className="speed">
            {[1, 2, 4].map(s => (
              <button key={s} className={`sp-btn ${clock.speed === s ? "active" : ""}`} onClick={() => clock.setSpeed(s)}>{s}×</button>
            ))}
            <button className="reset-btn" onClick={() => clock.setT(0)}>↺</button>
          </div>
          <Sponsors />
        </div>
      )}

      {/* MAIN */}
      <main className="main">{screenEl}</main>

      {/* FLOW RAIL */}
      <footer className="foot">
        <div className="flow-rail">
          {FLOW_BEATS.map((beat, i) => (
            <React.Fragment key={i}>
              <button
                className={`rail-step ${beatReached(i) ? "reached" : ""} ${currentBeat === i ? "current" : ""}`}
                onClick={() => {
                  const screenMap = [0,1,2,3,4,5,6,6,6];
                  jump(screenMap[i] || 0);
                }}
              >
                <span className="dot" />
                <span>{beat}</span>
              </button>
              {i < FLOW_BEATS.length - 1 && (
                <span className={`rail-gap ${beatReached(i) ? "reached" : ""}`} />
              )}
            </React.Fragment>
          ))}
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
