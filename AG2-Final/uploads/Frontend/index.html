<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Concord Lite · Mission Control</title>
<style>
/* Concord Lite — terminal/instruments aesthetic */
:root {
  --bg:        #0c0f0a;
  --surface:   #13160f;
  --surface-2: #181b13;
  --border:    #242820;
  --border-2:  #2e3327;
  --gold:      #c8b560;
  --gold-dim:  #8a7a3f;
  --sage:      #7a9e7e;
  --brick:     #b85c4a;
  --orange:    #c4854a;
  --text:      #d4ceb8;
  --text-2:    #6b6b58;
  --text-3:    #4a4a3d;
  --mono: ui-monospace, "SF Mono", "Menlo", "DejaVu Sans Mono", "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
button { font-family: inherit; font-size: inherit; color: inherit; }
hr { border: 0; border-top: 1px solid var(--border); margin: 0; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.brand { padding: 10px 18px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; }
.brand .mark { color: var(--gold); font-weight: 600; letter-spacing: 0.18em; font-size: 12px; }
.brand .sub  { color: var(--text-3); font-size: 10.5px; letter-spacing: 0.12em; }

.tabs { display: flex; align-items: stretch; padding: 0 6px; }
.tab {
  background: transparent; border: 0; padding: 0 16px; height: 100%;
  color: var(--text-2); letter-spacing: 0.14em; font-size: 11.5px;
  text-transform: uppercase; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab .num { color: var(--text-3); font-size: 10px; }
.tab.active .num { color: var(--gold-dim); }

.status-cluster { display: flex; align-items: center; gap: 14px; padding: 0 18px; border-left: 1px solid var(--border); }
.status-line { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; display: inline-block; }
.status-dot.fail { background: var(--brick); }
.status-dot.ok   { background: var(--sage); }
.status-dot.warn { background: var(--orange); }
.status-dot.idle { background: var(--text-3); }
.status-text { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.status-text.fail { color: var(--brick); }
.status-text.ok   { color: var(--sage); }
.cursor { display: inline-block; width: 7px; height: 13px; background: var(--gold); margin-left: 2px; vertical-align: -2px; animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.meta-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.meta-cell { padding: 7px 14px; border-right: 1px solid var(--border); display: flex; gap: 10px; align-items: baseline; }
.meta-cell:last-child { border-right: 0; }
.meta-cell .lbl { color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
.meta-cell .val { color: var(--text); }

/* ---------- Page chrome ---------- */
.main { flex: 1; padding: 18px 22px 40px; max-width: 1480px; width: 100%; margin: 0 auto; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 14px;
}
.section-head h2 { font-size: 12px; margin: 0; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); font-weight: 600; }
.section-head .right { color: var(--text-3); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

.row { display: flex; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1; }

/* ---------- Cards / blocks ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-2);
}
.card-head .right { color: var(--text-3); }
.card-body { padding: 12px; }

/* ---------- Stat blocks (Overview) ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  padding: 14px 16px; position: relative;
}
.stat .lbl { color: var(--text-2); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; }
.stat .num { font-size: 38px; font-weight: 600; color: var(--text); margin-top: 4px; letter-spacing: -0.01em; line-height: 1; }
.stat .num.gold  { color: var(--gold); }
.stat .num.brick { color: var(--brick); }
.stat .num.sage  { color: var(--sage); }
.stat .delta { color: var(--text-3); font-size: 10.5px; margin-top: 6px; letter-spacing: 0.1em; }
.stat-accent { position: absolute; top: 0; left: 0; width: 3px; height: 100%; }
.stat-accent.brick { background: var(--brick); }
.stat-accent.gold  { background: var(--gold); }
.stat-accent.sage  { background: var(--sage); }

/* ---------- Agent pipeline ---------- */
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
.agent-box {
  border: 1px solid var(--border); border-right: 0;
  padding: 12px; background: var(--surface);
  cursor: pointer; position: relative; min-height: 96px;
  display: flex; flex-direction: column; justify-content: space-between;
  text-align: left;
}
.agent-box:last-child { border-right: 1px solid var(--border); }
.agent-box:hover { background: var(--surface-2); }
.agent-box .head { display: flex; align-items: center; justify-content: space-between; }
.agent-box .id { color: var(--text-3); font-size: 10px; letter-spacing: 0.22em; }
.agent-box .name { color: var(--text); font-size: 12px; margin-top: 6px; letter-spacing: 0.04em; }
.agent-box .note { color: var(--text-2); font-size: 10.5px; margin-top: 8px; }
.agent-box .stat-line { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.agent-box.fail .name { color: var(--brick); }
.agent-box.fail::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brick); }
.agent-box.pass::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sage); }
.pipe-arrow { color: var(--text-3); display: flex; align-items: center; justify-content: center; }

/* ---------- Pipeline graph ---------- */
.pgraph-wrap { background: var(--surface); border: 1px solid var(--border); }
.pgraph-controls {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2);
}
.pgraph-controls .ctl {
  background: transparent; border: 1px solid var(--border-2);
  color: var(--text); padding: 5px 12px; cursor: pointer;
  letter-spacing: 0.18em; font-size: 10.5px; text-transform: uppercase;
}
.pgraph-controls .ctl:hover { background: var(--surface-2); }
.pgraph-controls .ctl.primary { border-color: var(--gold); color: var(--gold); }
.pgraph-controls .ctl.primary:hover { background: rgba(200,181,96,0.07); }
.pgraph-controls .step-readout { font-variant-numeric: tabular-nums; color: var(--text); }
.pgraph-controls .legend { display: flex; gap: 14px; margin-left: auto; }
.pgraph-controls .legend .lg { display: flex; align-items: center; gap: 6px; }
.pgraph-controls .legend .lg .sq { width: 9px; height: 9px; display: inline-block; }
.pgraph-controls .legend .idle { background: var(--text-3); }
.pgraph-controls .legend .run  { background: var(--gold); }
.pgraph-controls .legend .pass { background: var(--sage); }
.pgraph-controls .legend .fail { background: var(--brick); }

.pgraph-svg { display: block; width: 100%; height: 240px; background: var(--bg); }
.pgraph-svg .edge { stroke: var(--border-2); stroke-width: 1; fill: none; }
.pgraph-svg .edge.active { stroke: var(--gold); stroke-width: 1.5; }
.pgraph-svg .edge.pass { stroke: var(--sage); stroke-width: 1; }
.pgraph-svg .edge.fail { stroke: var(--brick); stroke-width: 1; }
.pgraph-svg .edge.warn { stroke: var(--orange); stroke-width: 1; }
.pgraph-svg .node-ring { fill: var(--surface); stroke: var(--text-3); stroke-width: 1; }
.pgraph-svg .node-ring.idle { stroke: var(--text-3); }
.pgraph-svg .node-ring.run  { stroke: var(--gold); }
.pgraph-svg .node-ring.pass { stroke: var(--sage); }
.pgraph-svg .node-ring.fail { stroke: var(--brick); }
.pgraph-svg .node-fill.idle { fill: transparent; }
.pgraph-svg .node-fill.run  { fill: var(--gold); }
.pgraph-svg .node-fill.pass { fill: var(--sage); }
.pgraph-svg .node-fill.fail { fill: var(--brick); }
.pgraph-svg .node-fill.run-pulse { animation: nodePulse 1.05s steps(2) infinite; }
@keyframes nodePulse { 50% { opacity: 0.35; } }
.pgraph-svg .label { fill: var(--text); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.pgraph-svg .sublabel { fill: var(--text-3); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; }
.pgraph-svg .ctx-line { fill: var(--text-2); font-family: var(--mono); font-size: 9.5px; }
.pgraph-svg .ctx-line.bad { fill: var(--brick); }
.pgraph-svg .step-tick { stroke: var(--border); stroke-width: 1; }
.pgraph-svg .step-tick.now { stroke: var(--gold); stroke-width: 1.5; }
.pgraph-svg .step-label { fill: var(--text-3); font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; }

.pgraph-foot {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--border); font-size: 10.5px;
}
.pgraph-foot .cell {
  padding: 8px 10px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.pgraph-foot .cell:last-child { border-right: 0; }
.pgraph-foot .cell .ag { color: var(--text); font-size: 11px; letter-spacing: 0.04em; }
.pgraph-foot .cell .ev { color: var(--text-3); letter-spacing: 0.16em; text-transform: uppercase; font-size: 9.5px; }

/* ---------- Tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl thead th {
  text-align: left; color: var(--text-3); font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; font-size: 10px;
  padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg);
}
.tbl tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .num-col { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.tbl .ts { color: var(--text-3); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* status pills (squares actually) */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
.pill .sq { width: 8px; height: 8px; display: inline-block; }
.pill.pass .sq, .sq.pass { background: var(--sage); }
.pill.fail .sq, .sq.fail { background: var(--brick); }
.pill.warn .sq, .sq.warn { background: var(--orange); }
.pill.ok .sq,   .sq.ok   { background: var(--sage); }
.pill.high .sq, .sq.high { background: var(--brick); }
.pill.med  .sq, .sq.med  { background: var(--orange); }
.pill.pass { color: var(--sage); }
.pill.fail { color: var(--brick); }
.pill.warn { color: var(--orange); }
.pill.high { color: var(--brick); }
.pill.med  { color: var(--orange); }

/* ---------- Trace screen ---------- */
.trace-row td:first-child { color: var(--text-3); width: 36px; text-align: right; }
.trace-row .agent { color: var(--gold); }
.trace-row .type { color: var(--text-2); letter-spacing: 0.12em; font-size: 10.5px; text-transform: uppercase; }
.trace-row.fail .agent { color: var(--brick); }
.trace-row.warn .agent { color: var(--orange); }
.trace-row .ctx { color: var(--text); font-size: 11.5px; }
.kv { color: var(--text-2); }
.kv b { color: var(--text); font-weight: 500; }
.kv .bad { color: var(--brick); }

/* ---------- Violations screen ---------- */
.viol-row {
  display: grid; grid-template-columns: 4px 90px 110px 1fr 1.4fr 200px 90px;
  border: 1px solid var(--border); border-bottom: 0; background: var(--surface);
  align-items: stretch; cursor: pointer;
}
.viol-list .viol-row:last-child { border-bottom: 1px solid var(--border); }
.viol-row:hover { background: var(--surface-2); }
.viol-row .sev-bar { background: var(--brick); }
.viol-row.med .sev-bar { background: var(--orange); }
.viol-row > div { padding: 12px 14px; border-right: 1px solid var(--border); }
.viol-row > div:last-child { border-right: 0; }
.viol-row .sev-bar { padding: 0; border-right: 0; }
.viol-row .id { color: var(--text-2); letter-spacing: 0.16em; font-size: 11px; }
.viol-row .ctype { color: var(--text); letter-spacing: 0.16em; font-size: 11px; text-transform: uppercase; }
.viol-row .title { color: var(--text); font-size: 12.5px; }
.viol-row .exp { color: var(--text-2); font-size: 11.5px; }
.viol-row .exp .lbl { color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; font-size: 9.5px; display: block; margin-top: 2px; }
.viol-row .exp .lbl:first-child { margin-top: 0; }
.viol-row .where { color: var(--text); font-size: 11.5px; }
.viol-row .where .step { color: var(--gold); }
.viol-row .where .agent { color: var(--text); }

/* ---------- Patch / diff ---------- */
.patch-block { border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; }
.patch-head {
  display: grid; grid-template-columns: 90px 1fr 200px 90px;
  align-items: center; border-bottom: 1px solid var(--border);
}
.patch-head > div { padding: 10px 14px; border-right: 1px solid var(--border); }
.patch-head > div:last-child { border-right: 0; }
.patch-head .ctitle { color: var(--text); font-size: 12.5px; }
.patch-head .prim { color: var(--gold); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; }
.patch-head .id { color: var(--text-2); letter-spacing: 0.18em; font-size: 11px; }
.diff { display: grid; grid-template-columns: 1fr 1fr; }
.diff .pane { padding: 10px 0; border-right: 1px solid var(--border); }
.diff .pane:last-child { border-right: 0; }
.diff .pane-head { padding: 4px 14px 8px; color: var(--text-3); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.diff .pane.rem .pane-head { color: var(--brick); }
.diff .pane.add .pane-head { color: var(--sage); }
.diff .line { padding: 1px 14px 1px 28px; font-size: 12px; white-space: pre; position: relative; color: var(--text); }
.diff .pane.rem .line { color: var(--text); }
.diff .pane.rem .line::before { content: "-"; position: absolute; left: 14px; color: var(--brick); }
.diff .pane.add .line::before { content: "+"; position: absolute; left: 14px; color: var(--sage); }
.diff .pane.rem .line { background: rgba(184, 92, 74, 0.05); }
.diff .pane.add .line { background: rgba(122, 158, 126, 0.05); }

/* ---------- Terminal ---------- */
.term {
  background: var(--bg); border: 1px solid var(--border);
  padding: 14px 16px; font-size: 12px; line-height: 1.55;
  max-height: 520px; overflow: auto;
}
.term .ln { display: grid; grid-template-columns: 70px 50px 1fr; gap: 10px; }
.term .ln .t { color: var(--text-3); }
.term .ln .k { letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; padding-top: 1px; }
.term .ln .k.info { color: var(--text-2); }
.term .ln .k.pass { color: var(--sage); }
.term .ln .k.fail { color: var(--brick); }
.term .ln .v { color: var(--text); white-space: pre-wrap; word-break: break-word; }
.term .ln .v.pass { color: var(--sage); }

/* ---------- Report ---------- */
.report-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
.summary p { margin: 0; color: var(--text); font-size: 13px; line-height: 1.65; }
.kv-list { display: grid; grid-template-columns: 200px 1fr; gap: 0; }
.kv-list > div { padding: 9px 14px; border-bottom: 1px solid var(--border); }
.kv-list > .lbl { color: var(--text-3); letter-spacing: 0.16em; font-size: 10.5px; text-transform: uppercase; }
.kv-list > .val { color: var(--text); }
.kv-list > div:nth-last-child(-n+2) { border-bottom: 0; }

.btn {
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold); padding: 9px 18px; cursor: pointer;
  letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px;
  border-radius: 0;
}
.btn:hover { background: rgba(200, 181, 96, 0.07); }
.btn.ghost { border-color: var(--border-2); color: var(--text); }
.btn.ghost:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: 10px; padding: 14px; }

.approval { border: 1px solid var(--border); background: var(--surface); }
.approval .big {
  padding: 18px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.approval .big .sq { width: 14px; height: 14px; display: inline-block; background: var(--orange); }
.approval .big .label { color: var(--orange); letter-spacing: 0.22em; text-transform: uppercase; font-size: 13px; font-weight: 600; }

/* ---------- Contracts mini-list ---------- */
.contracts-list { font-size: 12px; }
.contracts-list .row-c {
  display: grid; grid-template-columns: 70px 100px 1fr 80px;
  padding: 9px 12px; border-bottom: 1px solid var(--border); align-items: baseline; gap: 10px;
}
.contracts-list .row-c:last-child { border-bottom: 0; }
.contracts-list .id { color: var(--text-2); letter-spacing: 0.16em; font-size: 10.5px; }
.contracts-list .ctype { color: var(--text); letter-spacing: 0.16em; font-size: 10.5px; text-transform: uppercase; }
.contracts-list .rule { color: var(--text-2); font-size: 11.5px; }

/* ---------- misc ---------- */
.scroll { overflow: auto; }
.muted { color: var(--text-3); }
.text-2 { color: var(--text-2); }
.text-gold { color: var(--gold); }
.text-brick { color: var(--brick); }
.text-sage  { color: var(--sage); }
.text-orange{ color: var(--orange); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-2); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
// Concord Lite — Literature Review Assistant Run #041 fixture
window.CONCORD_DATA = {
  run: {
    id: "RUN-041",
    workflow: "LITERATURE_REVIEW_ASSISTANT",
    started: "2026-05-03T14:22:08Z",
    duration_ms: 18432,
    final_output_status: "EMITTED",
    operator: "j.kowalski",
    pattern: "AutoPattern",
    manager: "GroupChatManager",
    task: "Concise literature review on whether multi-agent systems improve reliability in research workflows."
  },
  stats: {
    violations: 4,
    agents_run: 5,
    repair_ready: 4,
    contracts_total: 5,
    contracts_passed: 1,
    events_total: 12,
    tool_events: 1
  },
  agents: [
    { id: "RES", name: "ResearcherAgent",  steps: 3, status: "PASS", note: "tavily_search x1" },
    { id: "CRT", name: "CriticAgent",      steps: 2, status: "PASS", note: "3 critique notes" },
    { id: "VRF", name: "VerifierAgent",    steps: 2, status: "FAIL", note: "no tool_event" },
    { id: "RPT", name: "ReporterAgent",    steps: 2, status: "FAIL", note: "verified=0" },
    { id: "ACT", name: "ActionAgent",      steps: 1, status: "FAIL", note: "approval=pending" }
  ],
  contracts: [
    { id: "C-EVD", type: "EVIDENCE", rule: "Reporter may write final answer only when verified_sources_count > 0", status: "FAIL" },
    { id: "C-TOL", type: "TOOL",     rule: "Claims of 'verified' / 'searched' / 'checked' require a matching tool_event", status: "FAIL" },

<script type="text/babel">
/* global React, ReactDOM */
const { useState, useEffect, useMemo } = React;
const D = window.CONCORD_DATA;

const SCREENS = [
  { id: "overview",   num: "01", label: "Overview" },
  { id: "trace",      num: "02", label: "Agent Trace" },
  { id: "violations", num: "03", label: "Violations" },

  { id: "regression", num: "05", label: "Regression" },
  { id: "report",     num: "06", label: "Final Report" },
];

function Sq({ kind }) { return <span className={`sq ${kind}`}></span>; }
function Pill({ kind, children }) {

}

function StatusCluster({ screen }) {

  const text = onReport ? "RERUN READY" : "4 VIOLATIONS DETECTED";
  const klass = onReport ? "ok" : "fail";
  return (
    <div className="status-cluster">
      <div className="status-line">
        <span className={`status-dot ${onReport ? "ok" : "fail"}`}></span>
        <span className={`status-text ${klass}`}>{text}</span>
        <span className="cursor"></span>
      </div>
      <div className="status-line muted" style={{fontSize: 11, letterSpacing: "0.14em"}}>
        14:22:26 UTC
      </div>
    </div>
  );
}

function TopBar({ screen, setScreen }) {
  return (
    <header className="topbar">
      <div className="brand">
        <div className="mark">CONCORD · LITE</div>
        <div className="sub">CONTRACT &nbsp;&middot;&nbsp; REPAIR &nbsp;&middot;&nbsp; REGRESSION</div>
      </div>
      <nav className="tabs">
        {SCREENS.map(s => (
          <button
            key={s.id}
            className={`tab ${screen === s.id ? "active" : ""}`}
            onClick={() => setScreen(s.id)}
          >
            <span className="num">{s.num}</span>
            <span>{s.label}</span>
          </button>
        ))}
      </nav>
      <StatusCluster screen={screen} />
    </header>
  );
}

function MetaStrip() {
  const r = D.run;
  return (
    <div className="meta-strip">
      <div className="meta-cell"><span className="lbl">Run</span><span className="val">{r.id}</span></div>
      <div className="meta-cell"><span className="lbl">Workflow</span><span className="val">{r.workflow}</span></div>
      <div className="meta-cell"><span className="lbl">Pattern</span><span className="val">{r.pattern}</span></div>
      <div className="meta-cell"><span className="lbl">Manager</span><span className="val">{r.manager}</span></div>
      <div className="meta-cell"><span className="lbl">Duration</span><span className="val">{(r.duration_ms/1000).toFixed(2)}s</span></div>
      <div className="meta-cell"><span className="lbl">Operator</span><span className="val">{r.operator}</span></div>
    </div>
  );
}

/* ---------------- PIPELINE GRAPH ---------------- */
// Map each agent to the steps that belong to them; status resolves from the
// worst event status seen for that agent up to the current scrub step.
const AGENT_STEPS = D.agents.map(a => ({
  id: a.id,
  name: a.name,
  steps: D.trace.filter(e => e.agent.startsWith(a.name.replace("Agent",""))).map(e => e.step),
}));
// Manually pin step ranges (manager session_start -> RES; everything else by name)
const AGENT_STEP_MAP = {
  RES: [2, 3, 4, 5],
  CRT: [6, 7],
  VRF: [8, 9, 10],
  RPT: [11],
  ACT: [12],
};
const TOTAL_STEPS = D.trace.length; // 12
const FIRST_STEP = 1;

function agentStateAt(agentId, currentStep) {
  const range = AGENT_STEP_MAP[agentId];
  const start = range[0], end = range[range.length - 1];
  if (currentStep < start) return "idle";
  if (currentStep >= start && currentStep < end) return "run";
  // currentStep >= end: collapse all events <= end for this agent
  const events = D.trace.filter(e => range.includes(e.step) && e.step <= currentStep);
  if (events.some(e => e.status === "FAIL")) return "fail";
  if (events.some(e => e.status === "WARN")) return "warn";
  return "pass";
}

function edgeStateAt(fromIdx, currentStep) {
  // Edge fromIdx -> fromIdx+1 lights when 'from' agent has finished AND 'to' has started.
  const fromId = D.agents[fromIdx].id;
  const toId = D.agents[fromIdx + 1].id;
  const fromEnd = AGENT_STEP_MAP[fromId][AGENT_STEP_MAP[fromId].length - 1];
  const toStart = AGENT_STEP_MAP[toId][0];
  if (currentStep < fromEnd) return "idle";
  if (currentStep >= fromEnd && currentStep < toStart) return "active";
  // After handoff, color edge by the from-agent's resolved state
  const fs = agentStateAt(fromId, currentStep);
  return fs;
}

function PipelineGraph({ setScreen }) {
  const [step, setStep] = useState(TOTAL_STEPS);
  const [playing, setPlaying] = useState(false);

  useEffect(() => {
    if (!playing) return;
    if (step >= TOTAL_STEPS) { setPlaying(false); return; }
    const t = setTimeout(() => setStep(s => s + 1), 520);
    return () => clearTimeout(t);
  }, [playing, step]);

  const replay = () => { setStep(0); setPlaying(true); };
  const togglePlay = () => {
    if (step >= TOTAL_STEPS) { setStep(0); setPlaying(true); }
    else setPlaying(p => !p);
  };
  const reset = () => { setPlaying(false); setStep(TOTAL_STEPS); };

  // Layout
  const W = 1200, H = 240;
  const nodeY = 96;
  const nodeXs = D.agents.map((_, i) => 90 + i * ((W - 180) / (D.agents.length - 1)));

  const currentEvent = D.trace.find(e => e.step === step);
  const ctxLine = currentEvent
    ? Object.entries(currentEvent.ctx || {}).map(([k,v]) => `${k}=${typeof v === "string" ? `"${v}"` : v}`).join("  ·  ")
    : "";

  const stateColor = {
    idle: "var(--text-3)",
    run:  "var(--gold)",
    pass: "var(--sage)",
    fail: "var(--brick)",
    warn: "var(--orange)",
    active: "var(--gold)",
  };

  return (
    <div className="pgraph-wrap" style={{marginBottom: 22}}>
      <div className="pgraph-controls">
        <button className="ctl primary" onClick={replay}>▶ REPLAY RUN</button>
        <button className="ctl" onClick={togglePlay}>{playing ? "❚❚ PAUSE" : "▶ PLAY"}</button>
        <button className="ctl" onClick={reset}>■ END STATE</button>
        <span className="step-readout">STEP {String(step).padStart(2,"0")} / {String(TOTAL_STEPS).padStart(2,"0")}</span>
        <span className="muted" style={{fontSize: 10.5}}>
          {currentEvent ? `${currentEvent.ts}  ${currentEvent.agent}.${currentEvent.type}` : "session not started"}
        </span>
        <span className="legend">
          <span className="lg"><span className="sq idle"></span><span>IDLE</span></span>
          <span className="lg"><span className="sq run"></span><span>RUN</span></span>
          <span className="lg"><span className="sq pass"></span><span>PASS</span></span>
          <span className="lg"><span className="sq fail"></span><span>FAIL</span></span>
        </span>
      </div>

      <svg className="pgraph-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        {/* baseline rail */}
        <line x1={nodeXs[0]} y1={nodeY} x2={nodeXs[nodeXs.length-1]} y2={nodeY} className="edge" />
        {/* edges */}
        {D.agents.slice(0, -1).map((a, i) => {
          const st = edgeStateAt(i, step);
          const x1 = nodeXs[i] + 20, x2 = nodeXs[i+1] - 20;
          const cls = `edge ${st}`;
          return (
            <g key={`e-${i}`}>
              <line x1={x1} y1={nodeY} x2={x2} y2={nodeY} className={cls} />
              {/* arrow head */}
              <polyline
                points={`${x2-6},${nodeY-4} ${x2},${nodeY} ${x2-6},${nodeY+4}`}
                fill="none" stroke={stateColor[st] || "var(--text-3)"} strokeWidth="1"
              />
              {/* handoff tick label */}
              <text x={(x1+x2)/2} y={nodeY - 12} textAnchor="middle" className="sublabel">
                handoff
              </text>
            </g>
          );
        })}
        {/* nodes */}
        {D.agents.map((a, i) => {
          const st = agentStateAt(a.id, step);
          const cx = nodeXs[i];
          return (
            <g key={a.id} style={{cursor: "pointer"}} onClick={() => setScreen("trace")}>
              {/* outer square ring */}
              <rect
                x={cx-20} y={nodeY-20} width="40" height="40"
                className={`node-ring ${st}`}
              />
              {/* inner fill (smaller square) — solid status fill, no gradients */}
              <rect
                x={cx-12} y={nodeY-12} width="24" height="24"
                className={`node-fill ${st} ${st === "run" ? "run-pulse" : ""}`}
              />
              {/* step badge */}
              <text x={cx} y={nodeY-30} textAnchor="middle" className="sublabel">
                {String(i+1).padStart(2,"0")} · {a.id}
              </text>
              {/* agent name */}
              <text x={cx} y={nodeY+42} textAnchor="middle" className="label">
                {a.name.replace("Agent","")}
              </text>
              <text x={cx} y={nodeY+56} textAnchor="middle" className="sublabel">
                {st === "idle" ? "PENDING" : st === "run" ? "RUNNING" : st.toUpperCase()}
              </text>
              {/* per-step ticks under each node */}
              {AGENT_STEP_MAP[a.id].map((s, j) => (
                <line key={s}
                  x1={cx - (AGENT_STEP_MAP[a.id].length-1)*4 + j*8}
                  y1={nodeY+72}
                  x2={cx - (AGENT_STEP_MAP[a.id].length-1)*4 + j*8}
                  y2={nodeY+78}
                  className={`step-tick ${s === step ? "now" : ""}`}
                  stroke={s <= step ? (s === step ? "var(--gold)" : stateColor[st]) : "var(--border)"}
                />
              ))}
            </g>
          );
        })}
        {/* current-event ctx readout */}
        {currentEvent && (
          <text x={W/2} y={H-14} textAnchor="middle" className={`ctx-line ${currentEvent.status === "FAIL" ? "bad" : ""}`}>
            {ctxLine.length > 130 ? ctxLine.slice(0,128) + "…" : ctxLine}
          </text>
        )}
      </svg>

      <div className="pgraph-foot">
        {D.agents.map(a => {
          const st = agentStateAt(a.id, step);
          return (
            <div key={a.id} className="cell">
              <span className="ev">{a.id} · {st === "idle" ? "—" : `${AGENT_STEP_MAP[a.id].filter(s => s <= step).length}/${AGENT_STEP_MAP[a.id].length} STEPS`}</span>
              <span className="ag">{a.note}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- OVERVIEW ---------------- */
function Overview({ setScreen }) {
  return (
    <>
      <div className="section-head">
        <h2>Run Summary &nbsp;//&nbsp; {D.run.id} &nbsp;&middot;&nbsp; {D.run.workflow}</h2>
        <div className="right">started 14:22:08 UTC &nbsp;&middot;&nbsp; trace nominal</div>
      </div>

      <div className="stat-grid" style={{marginBottom: 22}}>
        <div className="stat">
          <div className="stat-accent brick"></div>
          <div className="lbl">Contract Violations</div>
          <div className="num brick">{D.stats.violations}</div>
          <div className="delta">3 HIGH &nbsp;/&nbsp; 1 MED &nbsp;/&nbsp; 0 LOW</div>
        </div>
        <div className="stat">
          <div className="stat-accent gold"></div>
          <div className="lbl">Agents Run</div>
          <div className="num gold">{D.stats.agents_run}</div>
          <div className="delta">{D.stats.events_total} events &nbsp;&middot;&nbsp; {D.stats.tool_events} tool event</div>
        </div>
        <div className="stat">
          <div className="stat-accent sage"></div>
          <div className="lbl">Repair Ready</div>
          <div className="num sage">{D.stats.repair_ready} <span style={{color: "var(--text-3)", fontSize: 16}}>/ {D.stats.violations}</span></div>
          <div className="delta">AG2 primitives mapped &nbsp;&middot;&nbsp; 4 PATCHES</div>
        </div>
      </div>

      <div className="section-head">
        <h2>Agent Pipeline &nbsp;//&nbsp; live execution graph</h2>
        <div className="right">replay run · click any node to inspect trace</div>
      </div>
      <PipelineGraph setScreen={setScreen} />

      <div className="row" style={{alignItems: "stretch"}}>
        <div className="card grow">
          <div className="card-head">
            <span>Contract Status</span>
            <span className="right">{D.stats.contracts_passed} / {D.stats.contracts_total} passing</span>
          </div>
          <div className="contracts-list">
            {D.contracts.map(c => (
              <div key={c.id} className="row-c">
                <span className="id">{c.id}</span>
                <span className="ctype">{c.type}</span>
                <span className="rule">{c.rule}</span>
                <span><Pill kind={c.status.toLowerCase()}>{c.status}</Pill></span>
              </div>
            ))}
          </div>
        </div>
        <div className="card" style={{width: 360}}>
          <div className="card-head"><span>Run Task</span><span className="right">user input</span></div>
          <div className="card-body">
            <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase", marginBottom: 8}}>Question</div>
            <div style={{lineHeight: 1.6, marginBottom: 14}}>{D.run.task}</div>
            <hr />
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12, fontSize: 11.5}}>
              <div><div className="muted" style={{fontSize: 10, letterSpacing: "0.14em"}}>RETRIEVED</div><div>7 sources</div></div>
              <div><div className="muted" style={{fontSize: 10, letterSpacing: "0.14em"}}>VERIFIED</div><div className="text-brick">0 sources</div></div>
              <div><div className="muted" style={{fontSize: 10, letterSpacing: "0.14em"}}>HANDOFFS</div><div>4</div></div>
              <div><div className="muted" style={{fontSize: 10, letterSpacing: "0.14em"}}>APPROVAL</div><div className="text-brick">pending</div></div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------------- TRACE ---------------- */
function Trace() {
  const renderCtx = (e) => {
    const entries = Object.entries(e.ctx || {});
    return entries.map(([k, v], i) => {
      const isBad = (k === "verified_sources_count" && v === 0) || (k === "approval_status" && v === "pending");
      return (
        <span key={k} className="kv">
          <b>{k}</b>=<span className={isBad ? "bad" : ""}>{typeof v === "string" ? `"${v}"` : String(v)}</span>
          {i < entries.length - 1 ? <span style={{color: "var(--text-3)"}}>{"  "}&middot;{"  "}</span> : null}
        </span>
      );
    });
  };
  return (
    <>
      <div className="section-head">
        <h2>Agent Trace &nbsp;//&nbsp; ordered timeline</h2>
        <div className="right">{D.trace.length} events &nbsp;&middot;&nbsp; 1 tool event &nbsp;&middot;&nbsp; 4 violations</div>
      </div>
      <div className="card">
        <div className="card-head">
          <span>events</span>
          <span className="right">step &nbsp;&middot;&nbsp; ts &nbsp;&middot;&nbsp; agent &nbsp;&middot;&nbsp; type &nbsp;&middot;&nbsp; ctx &nbsp;&middot;&nbsp; status</span>
        </div>
        <table className="tbl">
          <thead>
            <tr>
              <th style={{width: 36}}>#</th>
              <th style={{width: 110}}>Timestamp</th>
              <th style={{width: 180}}>Agent</th>
              <th style={{width: 140}}>Event</th>
              <th>Context</th>
              <th style={{width: 130}}>Status</th>
            </tr>
          </thead>
          <tbody>
            {D.trace.map(e => (
              <tr key={e.step} className={`trace-row ${e.status === "FAIL" ? "fail" : e.status === "WARN" ? "warn" : ""}`}>
                <td>{String(e.step).padStart(2, "0")}</td>
                <td className="ts">{e.ts}</td>
                <td><span className="agent">{e.agent}</span></td>
                <td><span className="type">{e.type}</span></td>
                <td className="ctx">{renderCtx(e)}</td>
                <td>
                  {e.status === "OK"   && <Pill kind="pass">PASS</Pill>}
                  {e.status === "FAIL" && <Pill kind="fail">FAIL · {e.flag}</Pill>}
                  {e.status === "WARN" && <Pill kind="warn">WARN · {e.flag}</Pill>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{marginTop: 12, color: "var(--text-3)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase"}}>
        end of trace &nbsp;&middot;&nbsp; final_output emitted at step 11 &nbsp;&middot;&nbsp; side_effect attempted at step 12
      </div>
    </>
  );
}

/* ---------------- VIOLATIONS ---------------- */
function Violations({ setScreen, setSelectedPatch }) {
  const onClick = (v) => {
    const p = D.patches.find(p => p.violation === v.id);
    if (p) setSelectedPatch(p.id);
    setScreen("repair");
  };
  return (
    <>
      <div className="section-head">
        <h2>Contract Violations &nbsp;//&nbsp; {D.violations.length} detected</h2>
        <div className="right">click row to view repair patch</div>
      </div>

      <div className="viol-list" style={{marginBottom: 14}}>
        <div className="viol-row" style={{background: "var(--bg)", cursor: "default"}}>
          <div className="sev-bar" style={{background: "var(--border-2)"}}></div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Severity</div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Contract</div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Title</div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Expected / Observed</div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Failed Agent · Step</div>
          <div className="muted" style={{letterSpacing: "0.16em", fontSize: 10, textTransform: "uppercase"}}>Patch</div>
        </div>
        {D.violations.map(v => {
          const patch = D.patches.find(p => p.violation === v.id);
          return (
            <div key={v.id} className={`viol-row ${v.severity === "MED" ? "med" : ""}`} onClick={() => onClick(v)}>
              <div className="sev-bar"></div>
              <div>
                <div className="id">{v.id}</div>
                <div style={{marginTop: 4}}><Pill kind={v.severity.toLowerCase()}>{v.severity}</Pill></div>
              </div>
              <div className="ctype">
                <div>{v.type}</div>
                <div className="muted" style={{fontSize: 10, marginTop: 4, letterSpacing: "0.14em"}}>{v.contract}</div>
              </div>
              <div className="title">{v.title}</div>
              <div className="exp">
                <span className="lbl">Expected</span>
                <div>{v.expected}</div>
                <span className="lbl">Observed</span>
                <div className="text-brick">{v.observed}</div>
              </div>
              <div className="where">
                <div className="agent">{v.failed_agent}</div>
                <div className="muted" style={{fontSize: 11, marginTop: 4}}>step <span className="step">{String(v.failed_step).padStart(2,"0")}</span></div>
              </div>
              <div>
                <div className="text-gold" style={{letterSpacing: "0.16em", fontSize: 11}}>{patch ? patch.id : "—"}</div>
                <div className="muted" style={{fontSize: 10.5, marginTop: 4, letterSpacing: "0.1em"}}>{patch ? patch.primitive : ""}</div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <div className="card-head">
          <span>Evidence Chain</span>
          <span className="right">deterministic checker output</span>
        </div>
        <div className="card-body" style={{padding: 0}}>
          <table className="tbl">
            <thead>
              <tr><th style={{width: 80}}>ID</th><th>Citation</th></tr>
            </thead>
            <tbody>
              {D.violations.flatMap(v =>
                v.evidence.map((e, i) => (
                  <tr key={`${v.id}-${i}`}>
                    <td className="text-2">{v.id}</td>
                    <td>{e}</td>
                  </tr>
                ))
              )}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

/* ---------------- REPAIR ---------------- */
function Repair({ selectedPatch, setSelectedPatch }) {
  return (
    <>
      <div className="section-head">
        <h2>Repair Patch &nbsp;//&nbsp; AG2-native primitives</h2>
        <div className="right">{D.patches.length} patches &nbsp;&middot;&nbsp; mapped from {D.violations.length} violations</div>
      </div>
      <div style={{display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap"}}>
        <button
          className={`btn ${selectedPatch === null ? "" : "ghost"}`}
          onClick={() => setSelectedPatch(null)}
        >ALL</button>
        {D.patches.map(p => (
          <button
            key={p.id}
            className={`btn ${selectedPatch === p.id ? "" : "ghost"}`}
            onClick={() => setSelectedPatch(p.id)}
          >{p.id} · {p.primitive.split(" ")[0]}</button>
        ))}
      </div>

      {D.patches
        .filter(p => selectedPatch === null || selectedPatch === p.id)
        .map(p => {
        const v = D.violations.find(v => v.id === p.violation);
        return (
          <div key={p.id} className="patch-block">
            <div className="patch-head">
              <div className="id">{p.id}</div>
              <div>
                <div className="ctitle">{p.title}</div>
                <div className="muted" style={{fontSize: 11, marginTop: 4}}>fixes <span className="text-brick">{v.id}</span> &nbsp;&middot;&nbsp; {v.type} CONTRACT &nbsp;&middot;&nbsp; failed at step {v.failed_step}</div>
              </div>
              <div className="prim">{p.primitive}</div>
              <div><Pill kind="ok">READY</Pill></div>
            </div>
            <div className="diff">
              <div className="pane rem">
                <div className="pane-head">— before &nbsp;&middot;&nbsp; {p.target}</div>
                {p.removed.map((line, i) => (
                  <div key={i} className="line">{line || " "}</div>
                ))}
              </div>
              <div className="pane add">
                <div className="pane-head">+ after &nbsp;&middot;&nbsp; {p.target}</div>
                {p.added.map((line, i) => (
                  <div key={i} className="line">{line || " "}</div>
                ))}
              </div>
            </div>
          </div>
        );
      })}
    </>
  );
}

/* ---------------- REGRESSION ---------------- */
function Regression() {
  const t = D.test;
  return (
    <>
      <div className="section-head">
        <h2>Regression Test &nbsp;//&nbsp; {t.runner}</h2>
        <div className="right">sandbox {t.sandbox_id} &nbsp;&middot;&nbsp; {t.image} &nbsp;&middot;&nbsp; {(t.duration_ms/1000).toFixed(2)}s</div>
      </div>

      <div className="row" style={{alignItems: "stretch", marginBottom: 14}}>
        <div className="card grow">
          <div className="card-head">
            <span>stdout &nbsp;&middot;&nbsp; {t.name}</span>
            <span className="right">live · daytona stream</span>
          </div>
          <div className="term">
            {t.lines.map((l, i) => (
              <div key={i} className="ln">
                <span className="t">{l.t}</span>
                <span className={`k ${l.k}`}>{l.k}</span>
                <span className={`v ${l.k === "pass" ? "pass" : ""}`}>{l.v || "\u00A0"}</span>
              </div>
            ))}
            <div className="ln">
              <span className="t">&gt;_</span>
              <span className="k info">term</span>
              <span className="v"><span className="cursor"></span></span>
            </div>
          </div>
        </div>
        <div className="card" style={{width: 360}}>
          <div className="card-head"><span>Sandbox</span><span className="right">daytona</span></div>
          <div className="kv-list">
            <div className="lbl">ID</div><div className="val">{t.sandbox_id}</div>
            <div className="lbl">Image</div><div className="val">{t.image}</div>
            <div className="lbl">Runner</div><div className="val">pytest 8.2.0</div>
            <div className="lbl">Duration</div><div className="val">{(t.duration_ms/1000).toFixed(2)}s</div>
            <div className="lbl">Status</div><div className="val"><Pill kind="pass">ALL PASS</Pill></div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><span>Assertions</span><span className="right">{t.assertions.length} · {t.assertions.length} passed</span></div>
        <table className="tbl">
          <thead>
            <tr>
              <th style={{width: 60}}>ID</th>
              <th>Assertion</th>
              <th style={{width: 100}}>Time</th>
              <th style={{width: 100}}>Status</th>
            </tr>
          </thead>
          <tbody>
            {t.assertions.map(a => (
              <tr key={a.id}>
                <td className="text-2">{a.id}</td>
                <td><span className="text-gold">{a.name}</span></td>
                <td className="num-col">{a.time_ms} ms</td>
                <td><Pill kind="pass">PASS</Pill></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

/* ---------------- REPORT ---------------- */
function Report({ setScreen }) {
  const r = D.report;
  return (
    <>
      <div className="section-head">
        <h2>Final Report &nbsp;//&nbsp; Contract Violation Report</h2>
        <div className="right">{D.run.id} &nbsp;&middot;&nbsp; ready for export</div>
      </div>

      <div className="report-grid" style={{marginBottom: 14}}>
        <div className="card summary">
          <div className="card-head"><span>Executive Summary</span><span className="right">auto-generated</span></div>
          <div className="card-body" style={{padding: "16px 18px"}}>
            <p>{r.summary}</p>
          </div>
        </div>
        <div className="approval">
          <div className="big">
            <span className="sq"></span>
            <span className="label">{r.approval.status.replace("_", " ")}</span>
          </div>
          <div className="kv-list">
            <div className="lbl">Operator</div><div className="val">{r.approval.operator}</div>
            <div className="lbl">Requested</div><div className="val">{r.approval.requested_at}</div>
            <div className="lbl">SLA</div><div className="val">{r.approval.sla}</div>
            <div className="lbl">Channel</div><div className="val">UserProxyAgent / HumanGate</div>
          </div>
          <hr />
          <div className="btn-row">
            <button className="btn">APPROVE &amp; RERUN</button>
            <button className="btn ghost">REJECT</button>
          </div>
        </div>
      </div>

      <div className="row" style={{alignItems: "stretch"}}>
        <div className="card grow">
          <div className="card-head"><span>Patches Applied</span><span className="right">{r.patches_applied.length} primitives</span></div>
          <div className="card-body" style={{padding: 0}}>
            <table className="tbl">
              <thead>
                <tr>
                  <th style={{width: 60}}>ID</th>
                  <th style={{width: 220}}>AG2 Primitive</th>
                  <th>Target</th>
                  <th style={{width: 90}}>Status</th>
                </tr>
              </thead>
              <tbody>
                {D.patches.map(p => (
                  <tr key={p.id}>
                    <td className="text-2">{p.id}</td>
                    <td className="text-gold" style={{letterSpacing: "0.12em", fontSize: 11.5}}>{p.primitive}</td>
                    <td>{p.target}</td>
                    <td><Pill kind="pass">APPLIED</Pill></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card" style={{width: 360}}>
          <div className="card-head"><span>Verification</span><span className="right">daytona</span></div>
          <div className="kv-list">
            <div className="lbl">Test</div><div className="val">{D.test.name}</div>
            <div className="lbl">Assertions</div><div className="val">4 / 4 passed</div>
            <div className="lbl">Sandbox</div><div className="val">{D.test.sandbox_id}</div>
            <div className="lbl">Duration</div><div className="val">{(D.test.duration_ms/1000).toFixed(2)}s</div>
          </div>
          <hr />
          <div className="btn-row">
            <button className="btn ghost" onClick={() => setScreen("regression")}>VIEW TEST</button>
            <button className="btn ghost">EXPORT JSON</button>
          </div>
        </div>
      </div>

      <div style={{marginTop: 22, color: "var(--text-3)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", borderTop: "1px solid var(--border)", paddingTop: 14, display: "flex", justifyContent: "space-between"}}>
        <span>concord-lite &nbsp;&middot;&nbsp; report v1 &nbsp;&middot;&nbsp; {D.run.id}</span>
        <span>workflow under test &nbsp;→&nbsp; contract violation &nbsp;→&nbsp; repair &nbsp;→&nbsp; regression test</span>
      </div>
    </>
  );
}

/* ---------------- APP ---------------- */
function App() {
  const [screen, setScreen] = useState("overview");
  const [selectedPatch, setSelectedPatch] = useState(null);

  // when leaving repair screen, clear filter
  useEffect(() => { if (screen !== "repair") setSelectedPatch(null); }, [screen]);

  return (
    <div className="shell" data-screen-label={SCREENS.find(s=>s.id===screen).num + " " + SCREENS.find(s=>s.id===screen).label}>
      <TopBar screen={screen} setScreen={setScreen} />
      <MetaStrip />
      <main className="main">
        {screen === "overview"   && <Overview setScreen={setScreen} />}
        {screen === "trace"      && <Trace />}
        {screen === "violations" && <Violations setScreen={setScreen} setSelectedPatch={setSelectedPatch} />}
        {screen === "repair"     && <Repair selectedPatch={selectedPatch} setSelectedPatch={setSelectedPatch} />}
        {screen === "regression" && <Regression />}
        {screen === "report"     && <Report setScreen={setScreen} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
