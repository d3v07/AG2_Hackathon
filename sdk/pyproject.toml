[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concord-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ag2[openai]>=0.12",
    "opentelemetry-sdk>=1.41,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["concord_sdk*"]
