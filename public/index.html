<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord Lite · Mission Control</title>
<style>
/* Concord Lite — terminal/instruments aesthetic */
:root {
  --bg:        #E8EAF0;
  --surface:   #FFFFFF;
  --surface-2: #DDE0EA;
  --border:    #B8BACE;
  --border-2:  #8688A4;
  --gold:      #F1642E;
  --gold-dim:  #FCDD9D;
  --sage:      #5F7E37;
  --brick:     #B83518;
  --orange:    #C97619;
  --text:      #1F1F33;
  --text-2:    #3D3D5A;
  --text-3:    #6E6E8C;
  --mono: ui-monospace, "SF Mono", "Menlo", "DejaVu Sans Mono", "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
button { font-family: inherit; font-size: inherit; color: inherit; }
hr { border: 0; border-top: 1px solid var(--border); margin: 0; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: stretch;
  background: #1F1F33;
  border: 1.5px solid #C8CADB;
  border-bottom-width: 0;
  box-shadow: 0 1px 0 #C8CADB;
}
.brand { padding: 12px 22px; border-right: 1.5px solid #C8CADB; display: flex; flex-direction: column; gap: 3px; justify-content: center; min-width: 0; }
.brand .mark { color: #F1642E; font-weight: 700; letter-spacing: 0.16em; font-size: 18px; line-height: 1; }
.brand .sub  { color: #8E8FAC; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; }

.tabs { display: flex; align-items: stretch; padding: 0; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab {
  background: transparent; border: 0; padding: 0 18px; height: 100%;
  color: #B8B9D0; letter-spacing: 0.14em; font-size: 11.5px;
  text-transform: uppercase; cursor: pointer;
  border-right: 1.5px solid #C8CADB;
  border-bottom: 3px solid transparent; margin-bottom: -2px; display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
}
.tabs .tab:last-child { border-right: 1.5px solid #C8CADB; }
.tab:hover { color: #FFFFFF; }
.tab.active { color: #F1642E; border-bottom-color: #F1642E; }
.tab .num { color: #6E6F8C; font-size: 10px; }
.tab.active .num { color: #FCDD9D; }

.status-cluster { display: flex; align-items: center; gap: 14px; padding: 0 18px; border-left: 1.5px solid #C8CADB; color: #B8B9D0; min-width: 0; }
.status-line { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; display: inline-block; }
.status-dot.fail { background: #FF6B4A; }
.status-dot.ok   { background: #A8C97A; }
.status-dot.warn { background: var(--orange); }
.status-dot.idle { background: var(--text-3); }
.status-text { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.status-text.fail { color: #FF6B4A; }
.status-text.ok   { color: #A8C97A; }
.source-toggle {
  display: inline-flex;
  border: 1.5px solid #C8CADB;
  background: #161628;
}
.source-btn {
  border: 0;
  border-right: 1.5px solid #C8CADB;
  background: transparent;
  color: #B8B9D0;
  cursor: pointer;
  font-size: 10px;
  letter-spacing: 0.16em;
  padding: 6px 9px;
  text-transform: uppercase;
}
.source-btn:last-child { border-right: 0; }
.source-btn.active { background: #F1642E; color: #FFFFFF; }
.source-badge {
  border: 1px solid currentColor;
  display: inline-flex;
  align-items: center;
  color: var(--orange);
  font-size: 10px;
  letter-spacing: 0.16em;
  padding: 2px 7px;
  text-transform: uppercase;
  white-space: nowrap;
}
.source-badge.live.connected { color: #A8C97A; }
.source-badge.live.connecting { color: var(--gold); }
.source-badge.live.error { color: #FF6B4A; }
.cursor { display: inline-block; width: 7px; height: 13px; background: var(--gold); margin-left: 2px; vertical-align: -2px; animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.meta-strip {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  background: var(--surface-2);
  border-bottom: 1.5px solid var(--text-2);
  font-size: 11px;
}
.meta-cell { padding: 8px 14px; border-right: 1.5px solid var(--text-2); display: flex; gap: 10px; align-items: baseline; }
.meta-cell:last-child { border-right: 0; }
.meta-cell .lbl { color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
.meta-cell .val { color: var(--text); }

/* ---------- Page chrome ---------- */
.main { flex: 1; padding: 18px 22px 40px; max-width: 1480px; width: 100%; margin: 0 auto; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1.5px solid var(--text-2); padding-bottom: 8px; margin-bottom: 14px;
}
.section-head h2 { font-size: 12px; margin: 0; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); font-weight: 600; }
.section-head .right { color: var(--text-3); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

.row { display: flex; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1; }

/* ---------- Cards / blocks ---------- */
.card {
  background: var(--surface);
  border: 1.5px solid var(--text-2);
  box-shadow: 0 1px 0 rgba(31, 31, 51, 0.04);
  border-radius: 2px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1.5px solid var(--text-2);
  background: var(--surface-2);
  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-2);
}
.card-head .right { color: var(--text-3); }
.card-body { padding: 12px; }

/* ---------- Stat blocks (Overview) ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stat {
  background: var(--surface); border: 1.5px solid var(--text-2);
  padding: 14px 16px; position: relative;
  box-shadow: 0 1px 0 rgba(31, 31, 51, 0.04);
}
.stat .lbl { color: var(--text-2); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; }
.stat .num { font-size: 38px; font-weight: 600; color: var(--text); margin-top: 4px; letter-spacing: -0.01em; line-height: 1; }
.stat .num.gold  { color: var(--gold); }
.stat .num.brick { color: var(--brick); }
.stat .num.sage  { color: var(--sage); }
.stat .delta { color: var(--text-3); font-size: 10.5px; margin-top: 6px; letter-spacing: 0.1em; }
.stat-accent { position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
.stat-accent.brick { background: var(--brick); }
.stat-accent.gold  { background: var(--gold); }
.stat-accent.sage  { background: var(--sage); }
.cost-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cost-metric { border: 1px solid var(--border); padding: 10px; background: var(--surface); min-width: 0; }
.cost-metric .lbl { color: var(--text-3); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
.cost-metric .val { color: var(--text); font-size: 18px; margin-top: 4px; white-space: nowrap; }
.cost-metric.total .val { color: var(--gold); }

/* ---------- Agent pipeline ---------- */
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
.agent-box {
  border: 1px solid var(--border); border-right: 0;
  padding: 12px; background: var(--surface);
  cursor: pointer; position: relative; min-height: 96px;
  display: flex; flex-direction: column; justify-content: space-between;
  text-align: left;
}
.agent-box:last-child { border-right: 1px solid var(--border); }
.agent-box:hover { background: var(--surface-2); }
.agent-box .head { display: flex; align-items: center; justify-content: space-between; }
.agent-box .id { color: var(--text-3); font-size: 10px; letter-spacing: 0.22em; }
.agent-box .name { color: var(--text); font-size: 12px; margin-top: 6px; letter-spacing: 0.04em; }
.agent-box .note { color: var(--text-2); font-size: 10.5px; margin-top: 8px; }
.agent-box .stat-line { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.agent-box.fail .name { color: var(--brick); }
.agent-box.fail::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brick); }
.agent-box.pass::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sage); }
.pipe-arrow { color: var(--text-3); display: flex; align-items: center; justify-content: center; }

/* ---------- Pipeline graph ---------- */
.pgraph-wrap { background: var(--surface); border: 1px solid var(--border); }
.pgraph-controls {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2);
}
.pgraph-controls .ctl {
  background: transparent; border: 1px solid var(--border-2);
  color: var(--text); padding: 5px 12px; cursor: pointer;
  letter-spacing: 0.18em; font-size: 10.5px; text-transform: uppercase;
}
.pgraph-controls .ctl:hover { background: var(--surface-2); }
.pgraph-controls .ctl.primary { border-color: var(--gold); color: var(--gold); }
.pgraph-controls .ctl.primary:hover { background: rgba(241, 100, 46, 0.08); }
.pgraph-controls .step-readout { font-variant-numeric: tabular-nums; color: var(--text); }
.pgraph-controls .legend { display: flex; gap: 14px; margin-left: auto; }
.pgraph-controls .legend .lg { display: flex; align-items: center; gap: 6px; }
.pgraph-controls .legend .lg .sq { width: 9px; height: 9px; display: inline-block; }
.pgraph-controls .legend .idle { background: var(--text-3); }
.pgraph-controls .legend .run  { background: var(--gold); }
.pgraph-controls .legend .pass { background: var(--sage); }
.pgraph-controls .legend .fail { background: var(--brick); }

.pgraph-svg { display: block; width: 100%; height: 270px; background: var(--bg); }
.pgraph-svg .edge { stroke: var(--border-2); stroke-width: 1; fill: none; }
.pgraph-svg .edge.active { stroke: var(--gold); stroke-width: 1.5; }
.pgraph-svg .edge.pass { stroke: var(--sage); stroke-width: 1; }
.pgraph-svg .edge.fail { stroke: var(--brick); stroke-width: 1; }
.pgraph-svg .edge.warn { stroke: var(--orange); stroke-width: 1; }
.pgraph-svg .node-ring { fill: var(--surface); stroke: var(--text-3); stroke-width: 1; }
.pgraph-svg .node-ring.idle { stroke: var(--text-3); }
.pgraph-svg .node-ring.run  { stroke: var(--gold); }
.pgraph-svg .node-ring.pass { stroke: var(--sage); }
.pgraph-svg .node-ring.fail { stroke: var(--brick); }
.pgraph-svg .node-fill.idle { fill: transparent; }
.pgraph-svg .node-fill.run  { fill: var(--gold); }
.pgraph-svg .node-fill.pass { fill: var(--sage); }
.pgraph-svg .node-fill.fail { fill: var(--brick); }
.pgraph-svg .node-fill.run-pulse { animation: nodePulse 1.05s steps(2) infinite; }
@keyframes nodePulse { 50% { opacity: 0.35; } }
.pgraph-svg .label { fill: var(--text); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.pgraph-svg .sublabel { fill: var(--text-3); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; }
.pgraph-svg .ctx-line { fill: var(--text-2); font-family: var(--mono); font-size: 9.5px; }
.pgraph-svg .ctx-line.bad { fill: var(--brick); }
.pgraph-svg .step-tick { stroke: var(--border); stroke-width: 1; }
.pgraph-svg .step-tick.now { stroke: var(--gold); stroke-width: 1.5; }
.pgraph-svg .step-label { fill: var(--text-3); font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; }

.pgraph-foot {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--border); font-size: 10.5px;
}
.pgraph-foot .cell {
  padding: 8px 10px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.pgraph-foot .cell:last-child { border-right: 0; }
.pgraph-foot .cell .ag { color: var(--text); font-size: 11px; letter-spacing: 0.04em; }
.pgraph-foot .cell .ev { color: var(--text-3); letter-spacing: 0.16em; text-transform: uppercase; font-size: 9.5px; }

/* ---------- Pipeline traveler (context envelope) ---------- */
.pgraph-svg .traveler-rect {
  fill: var(--bg);
  stroke: var(--gold);
  stroke-width: 1.5;
}
.pgraph-svg .traveler-glow {
  fill: var(--gold);
  opacity: 0.18;
}
.pgraph-svg .traveler-label {
  fill: var(--gold);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.pgraph-svg .traveler-tail {
  stroke: var(--gold);
  stroke-width: 1;
  fill: none;
  opacity: 0.5;
}
.pgraph-svg .traveler-pulse {
  fill: none;
  stroke: var(--gold);
  stroke-width: 1;
  opacity: 0.6;
  animation: travelerPulse 0.9s ease-out infinite;
}
@keyframes travelerPulse {
  0%   { r: 8; opacity: 0.6; }
  100% { r: 22; opacity: 0; }
}


.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl thead th {
  text-align: left; color: var(--text); font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; font-size: 10px;
  padding: 8px 10px; border-bottom: 1.5px solid var(--text-2); background: var(--surface-2);
}
.tbl tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .num-col { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.tbl .ts { color: var(--text-3); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* status pills (squares actually) */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
.pill .sq { width: 8px; height: 8px; display: inline-block; }
.pill.pass .sq, .sq.pass { background: var(--sage); }
.pill.fail .sq, .sq.fail { background: var(--brick); }
.pill.warn .sq, .sq.warn { background: var(--orange); }
.pill.ok .sq,   .sq.ok   { background: var(--sage); }
.pill.high .sq, .sq.high { background: var(--brick); }
.pill.med  .sq, .sq.med  { background: var(--orange); }
.pill.pass { color: var(--sage); }
.pill.fail { color: var(--brick); }
.pill.warn { color: var(--orange); }
.pill.high { color: var(--brick); }
.pill.med  { color: var(--orange); }

/* ---------- Trace screen ---------- */
.trace-row td:first-child { color: var(--text-3); width: 36px; text-align: right; }
.trace-row .agent { color: var(--gold); }
.trace-row .type { color: var(--text-2); letter-spacing: 0.12em; font-size: 10.5px; text-transform: uppercase; }
.trace-row.fail .agent { color: var(--brick); }
.trace-row.warn .agent { color: var(--orange); }
.trace-row .ctx { color: var(--text); font-size: 11.5px; }
.kv { color: var(--text-2); }
.kv b { color: var(--text); font-weight: 500; }
.kv .bad { color: var(--brick); }

/* ---------- Violations screen ---------- */
.viol-row {
  display: grid; grid-template-columns: 4px 90px 110px 1fr 1.4fr 200px 90px;
  border: 1.5px solid var(--text-2); border-bottom: 0; background: var(--surface);
  align-items: stretch; cursor: pointer;
}
.viol-list .viol-row:last-child { border-bottom: 1.5px solid var(--text-2); }
.viol-row:hover { background: var(--surface-2); }
.viol-row .sev-bar { background: var(--brick); }
.viol-row.med .sev-bar { background: var(--orange); }
.viol-row > div { padding: 12px 14px; border-right: 1px solid var(--border); }
.viol-row > div:last-child { border-right: 0; }
.viol-row .sev-bar { padding: 0; border-right: 0; }
.viol-row .id { color: var(--text-2); letter-spacing: 0.16em; font-size: 11px; }
.viol-row .ctype { color: var(--text); letter-spacing: 0.16em; font-size: 11px; text-transform: uppercase; }
.viol-row .title { color: var(--text); font-size: 12.5px; }
.viol-row .exp { color: var(--text-2); font-size: 11.5px; }
.viol-row .exp .lbl { color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; font-size: 9.5px; display: block; margin-top: 2px; }
.viol-row .exp .lbl:first-child { margin-top: 0; }
.viol-row .where { color: var(--text); font-size: 11.5px; }
.viol-row .where .step { color: var(--gold); }
.viol-row .where .agent { color: var(--text); }

/* ---------- Repair DAG (mini graphs above each diff) ---------- */
.rdag-stack { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.rdag-card { border: 1px solid var(--border); background: var(--surface); }
.rdag-head {
  display: grid; grid-template-columns: 90px 1fr 200px 110px;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.rdag-head > div { padding: 12px 14px; border-right: 1px solid var(--border); }
.rdag-head > div:last-child { border-right: 0; }
.rdag-head .id { color: var(--text-2); letter-spacing: 0.18em; font-size: 11px; }
.rdag-head .ctitle { color: var(--text); font-size: 12.5px; }
.rdag-head .prim {
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  padding: 4px 8px;
  letter-spacing: 0.14em; font-size: 10.5px; text-transform: uppercase;
  display: inline-block;
}
.rdag-body { padding: 14px 14px 0; }
.rdag-svg { display: block; width: 100%; height: 130px; background: var(--bg); }
.rdag-controls {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-top: 1px solid var(--border); margin-top: 10px;
}
.rdag-controls .status {
  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold);
}
.rdag-controls .status.applied { color: var(--sage); }
.rdag-btn {
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold); padding: 7px 14px; cursor: pointer;
  letter-spacing: 0.14em; font-size: 10.5px; text-transform: uppercase;
  transition: background 0.12s ease;
}
.rdag-btn:hover { background: rgba(241, 100, 46, 0.08); }
.rdag-btn:disabled { cursor: default; }
.rdag-btn.applying {
  border-color: var(--gold-dim); color: var(--gold-dim);
  animation: rdagBtnPulse 0.8s ease-in-out infinite;
}
.rdag-btn.applied {
  border-color: var(--sage); color: var(--sage);
  background: rgba(107, 138, 63, 0.08);
}
@keyframes rdagBtnPulse { 50% { opacity: 0.5; } }

/* SVG element classes for RepairDAG */
.rdag-svg .n-rect { stroke-width: 1; }
.rdag-svg .n-rect.fail { fill: #FCE8E2; stroke: var(--brick); stroke-width: 1.5; }
.rdag-svg .n-rect.pass { fill: #EEF1E2; stroke: var(--sage); stroke-width: 1.5; }
.rdag-svg .n-rect.fix  { fill: #FFEFD9; stroke: var(--gold); stroke-width: 1.5; }
.rdag-svg .n-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.rdag-svg .n-label.fail { fill: var(--brick); }
.rdag-svg .n-label.pass { fill: var(--sage); }
.rdag-svg .n-label.fix  { fill: var(--gold); }
.rdag-svg .n-sub { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
.rdag-svg .n-sub.fail { fill: #9C2A14; }
.rdag-svg .n-sub.pass { fill: #4F6A2C; }
.rdag-svg .n-sub.fix  { fill: #A04A12; }
.rdag-svg .n-status.fail { fill: var(--brick); }
.rdag-svg .n-status.pass { fill: var(--sage); }
.rdag-svg .e-line.broken {
  stroke: var(--brick); stroke-width: 1; fill: none;
  stroke-dasharray: 4 3;
}
.rdag-svg .e-line.applying {
  stroke: var(--gold); stroke-width: 1; fill: none; opacity: 0.5;
}
.rdag-svg .e-line.applied {
  stroke: var(--sage); stroke-width: 1; fill: none;
}
.rdag-svg .e-label {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.rdag-svg .e-label.broken { fill: var(--brick); }
.rdag-svg .e-label.applied { fill: var(--sage); }
.rdag-svg .e-label.applying { fill: var(--gold-dim); }
.rdag-svg .fix-pulse { animation: rdagFixPulse 0.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes rdagFixPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

.rdag-banner {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 14px;
  background: #EEF1E2; border: 1px solid var(--sage);
  padding: 14px 18px;
  margin-bottom: 18px;
}
.rdag-banner .head { color: var(--sage); letter-spacing: 0.14em; font-size: 12px; text-transform: uppercase; }
.rdag-banner .sub  { color: #4F6A2C; letter-spacing: 0.14em; font-size: 10.5px; text-transform: uppercase; margin-top: 4px; }
.rdag-banner .go {
  background: transparent; border: 1px solid var(--sage);
  color: var(--sage); padding: 9px 16px; cursor: pointer;
  letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase;
  transition: background 0.12s ease;
}
.rdag-banner .go:hover { background: rgba(107, 138, 63, 0.12); }

/* ---------- Patch / diff ---------- */
.patch-block { border: 1px solid var(--border); background: var(--surface); margin-bottom: 14px; }
.patch-head {
  display: grid; grid-template-columns: 90px 1fr 200px 90px;
  align-items: center; border-bottom: 1px solid var(--border);
}
.patch-head > div { padding: 10px 14px; border-right: 1px solid var(--border); }
.patch-head > div:last-child { border-right: 0; }
.patch-head .ctitle { color: var(--text); font-size: 12.5px; }
.patch-head .prim { color: var(--gold); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; }
.patch-head .id { color: var(--text-2); letter-spacing: 0.18em; font-size: 11px; }
.diff { display: grid; grid-template-columns: 1fr 1fr; }
.diff .pane { padding: 10px 0; border-right: 1px solid var(--border); }
.diff .pane:last-child { border-right: 0; }
.diff .pane-head { padding: 4px 14px 8px; color: var(--text-3); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.diff .pane.rem .pane-head { color: var(--brick); }
.diff .pane.add .pane-head { color: var(--sage); }
.diff .line { padding: 1px 14px 1px 28px; font-size: 12px; white-space: pre; position: relative; color: var(--text); }
.diff .pane.rem .line { color: var(--text); }
.diff .pane.rem .line::before { content: "-"; position: absolute; left: 14px; color: var(--brick); }
.diff .pane.add .line::before { content: "+"; position: absolute; left: 14px; color: var(--sage); }
.diff .pane.rem .line { background: rgba(199, 58, 31, 0.06); }
.diff .pane.add .line { background: rgba(107, 138, 63, 0.10); }

/* ---------- Terminal ---------- */
.term {
  background: var(--bg); border: 1px solid var(--border);
  padding: 14px 16px; font-size: 12px; line-height: 1.55;
  max-height: 520px; overflow: auto;
}
.term .ln { display: grid; grid-template-columns: 70px 50px 1fr; gap: 10px; }
.term .ln .t { color: var(--text-3); }
.term .ln .k { letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; padding-top: 1px; }
.term .ln .k.info { color: var(--text-2); }
.term .ln .k.pass { color: var(--sage); }
.term .ln .k.fail { color: var(--brick); }
.term .ln .v { color: var(--text); white-space: pre-wrap; word-break: break-word; }
.term .ln .v.pass { color: var(--sage); }

/* ---------- Report ---------- */
.report-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
.summary p { margin: 0; color: var(--text); font-size: 13px; line-height: 1.65; }
.kv-list { display: grid; grid-template-columns: 200px 1fr; gap: 0; }
.kv-list > div { padding: 9px 14px; border-bottom: 1px solid var(--border); }
.kv-list > .lbl { color: var(--text-3); letter-spacing: 0.16em; font-size: 10.5px; text-transform: uppercase; }
.kv-list > .val { color: var(--text); }
.kv-list > div:nth-last-child(-n+2) { border-bottom: 0; }

.btn {
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold); padding: 9px 18px; cursor: pointer;
  letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px;
  border-radius: 0;
}
.btn:hover { background: rgba(241, 100, 46, 0.08); }
.btn.ghost { border-color: var(--border-2); color: var(--text); }
.btn.ghost:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: 10px; padding: 14px; }

.approval { border: 1px solid var(--border); background: var(--surface); }
.approval .big {
  padding: 18px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.approval .big .sq { width: 14px; height: 14px; display: inline-block; background: var(--orange); }
.approval .big .label { color: var(--orange); letter-spacing: 0.22em; text-transform: uppercase; font-size: 13px; font-weight: 600; }

/* ---------- Contracts mini-list ---------- */
.contracts-list { font-size: 12px; }
.contracts-list .row-c {
  display: grid; grid-template-columns: 70px 100px 1fr 80px;
  padding: 9px 12px; border-bottom: 1px solid var(--border); align-items: baseline; gap: 10px;
}
.contracts-list .row-c:last-child { border-bottom: 0; }
.contracts-list .id { color: var(--text-2); letter-spacing: 0.16em; font-size: 10.5px; }
.contracts-list .ctype { color: var(--text); letter-spacing: 0.16em; font-size: 10.5px; text-transform: uppercase; }
.contracts-list .rule { color: var(--text-2); font-size: 11.5px; }

/* ---------- Workflow DAG screen ---------- */
.dag-wrap { background: var(--surface); border: 1px solid var(--border); }
.dag-head {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2);
}
.dag-head .legend { display: flex; gap: 14px; margin-left: auto; align-items: center; }
.dag-head .legend .lg { display: flex; align-items: center; gap: 6px; font-size: 10px; }
.dag-head .legend .sq { width: 9px; height: 9px; display: inline-block; }
.dag-head .legend .sq.ok    { background: var(--sage); }
.dag-head .legend .sq.skip  { background: var(--orange); }
.dag-head .legend .sq.miss  { background: var(--brick); }
.dag-head .legend .sq.prop  { background: var(--gold); }
.dag-head .legend .sq.idle  { background: var(--text-3); }

.dag-svg { display: block; width: 100%; height: 380px; background: var(--bg); }
.dag-svg .lane { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.dag-svg .edge { stroke: var(--text-3); stroke-width: 1; fill: none; }
.dag-svg .edge.ok   { stroke: var(--sage); }
.dag-svg .edge.skip { stroke: var(--orange); stroke-dasharray: 4 3; }
.dag-svg .edge.miss { stroke: var(--brick); }
.dag-svg .edge.prop { stroke: var(--gold); stroke-dasharray: 4 3; }
.dag-svg .node-rect { fill: var(--surface); stroke: var(--text-3); stroke-width: 1; }
.dag-svg .node-rect.agent  { stroke: var(--text-2); }
.dag-svg .node-rect.tool   { stroke: var(--gold-dim); }
.dag-svg .node-rect.gate   { stroke: var(--gold); stroke-dasharray: 3 2; }
.dag-svg .node-rect.manager{ stroke: var(--text); }
.dag-svg .node-rect.fail   { stroke: var(--brick); }
.dag-svg .node-rect.pass   { stroke: var(--sage); }
.dag-svg .node-id    { fill: var(--text-3); font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; }
.dag-svg .node-name  { fill: var(--text); font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; }
.dag-svg .node-role  { fill: var(--text-3); font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; }
.dag-svg .node-name.fail { fill: var(--brick); }
.dag-svg .node-name.pass { fill: var(--sage); }
.dag-svg .edge-label { fill: var(--text-2); font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; }
.dag-svg .edge-label.skip { fill: var(--orange); }
.dag-svg .edge-label.miss { fill: var(--brick); }
.dag-svg .edge-label.prop { fill: var(--gold); }
.dag-svg .recurrence-badge rect { fill: var(--surface); stroke: var(--border-2); stroke-width: 1; }
.dag-svg .recurrence-badge text { fill: var(--text-3); font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; }
.routes-tbl .recurrence-note { color: var(--text-3); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }

.routes-tbl .badge { display: inline-block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; }
.routes-tbl .badge.ok   { color: var(--sage); border-color: var(--sage); }
.routes-tbl .badge.skip { color: var(--orange); border-color: var(--orange); }
.routes-tbl .badge.miss { color: var(--brick); border-color: var(--brick); }
.routes-tbl .badge.prop { color: var(--gold); border-color: var(--gold); }

/* ---------- Trace mini-graph ---------- */
.trace-layout { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
.minirail {
  background: var(--surface); border: 1px solid var(--border);
  position: sticky; top: 14px;
}
.minirail .mh {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-2); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase;
}
.minirail svg { display: block; width: 100%; height: 520px; }
.minirail .lane-line { stroke: var(--border); stroke-width: 1; }
.minirail .lane-label { fill: var(--text-3); font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; }
.minirail .step { cursor: pointer; }
.minirail .step rect { stroke-width: 1; }
.minirail .step.ok   rect { fill: var(--sage); stroke: var(--sage); }
.minirail .step.fail rect { fill: var(--brick); stroke: var(--brick); }
.minirail .step.warn rect { fill: var(--orange); stroke: var(--orange); }
.minirail .step.idle rect { fill: var(--surface); stroke: var(--text-3); }
.minirail .step.active rect { stroke: var(--gold); stroke-width: 2; }
.minirail .step-num { fill: var(--text-3); font-family: var(--mono); font-size: 8.5px; }
.minirail .conn { stroke: var(--border-2); stroke-width: 1; fill: none; }
.minirail .conn.fail { stroke: var(--brick); }
.minirail .conn.warn { stroke: var(--orange); }

.trace-row.focused td { background: var(--surface-2) !important; box-shadow: inset 2px 0 0 var(--gold); }

/* ---------- micro-interaction polish ---------- */
.tab { transition: color 120ms ease, border-color 120ms ease; }
.btn, .ctl { transition: background 120ms ease, color 120ms ease, border-color 120ms ease; }
.viol-row { transition: background 120ms ease; }
.tbl tbody tr { transition: background 120ms ease; }
.kbd-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
.kbd-hint kbd {
  font-family: var(--mono); font-size: 10px;
  border: 1px solid var(--border-2); padding: 1px 6px; color: var(--text-2);
  background: var(--surface);
}


.scroll { overflow: auto; }
.muted { color: var(--text-3); }
.text-2 { color: var(--text-2); }
.text-gold { color: var(--gold); }
.text-brick { color: var(--brick); }
.text-sage  { color: var(--sage); }
.text-orange{ color: var(--orange); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-2); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

@media (max-width: 1100px) {
  .topbar { grid-template-columns: 1fr; }
  .brand, .status-cluster { border-left: 0; border-right: 0; }
  .tabs { overflow-x: auto; }
  .tab { min-height: 48px; white-space: nowrap; }
  .status-cluster { min-height: 48px; justify-content: space-between; }
  .meta-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-grid, .report-grid, .diff { grid-template-columns: 1fr; }
  .row { flex-direction: column; }
  .trace-layout { grid-template-columns: 1fr; }
  .minirail { position: static; }
  .viol-row { grid-template-columns: 4px 80px 96px minmax(180px, 1fr); overflow-x: auto; }
  .viol-row > div:nth-child(n+5) { display: none; }
}

@media (max-width: 640px) {
  html, body { overflow-x: hidden; }
  .brand { padding: 12px 18px; }
  .status-cluster {
    align-items: center;
    gap: 10px;
    justify-content: flex-start;
    overflow-x: auto;
    padding: 8px 18px;
  }
  .status-line.muted { display: none; }
  .main { padding: 16px 20px 32px; }
  .meta-cell { min-width: 0; }
  .meta-cell .val {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .section-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }
  .pgraph-controls {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pgraph-controls .legend { margin-left: 0; }
  .pgraph-foot { grid-template-columns: 1fr; }
  .pgraph-foot .cell { border-right: 0; border-bottom: 1px solid var(--border); }
  .pgraph-foot .cell:last-child { border-bottom: 0; }
  .dag-wrap { overflow-x: auto; }
  .dag-svg { min-width: 1240px; }
}

/* ---------- Phase 2: shell with sidebar ---------- */
.shell-with-sidebar { display: grid; grid-template-columns: auto 1fr; min-height: 100vh; }
.shell-main { display: flex; flex-direction: column; min-width: 0; }

.sidebar {
  background: #1F1F33;
  border-right: 1.5px solid #C8CADB;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 50;
}
.sidebar.collapsed { width: 36px; }
.sidebar.expanded { width: 240px; }
.sidebar-toggle {
  background: #1F1F33;
  border: 0;
  border-bottom: 1px solid #4a4a6a;
  color: #C8CADB;
  padding: 12px 0;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.18em;
}
.sidebar-toggle:hover { background: #2A2A47; }
.sidebar-body { padding: 12px; display: flex; flex-direction: column; gap: 14px; flex: 1; overflow: auto; }
.sidebar-section { display: flex; flex-direction: column; gap: 6px; }
.sidebar-cta {
  width: 100%;
  background: var(--gold);
  border: 1.5px solid var(--gold);
  color: #1F1F33;
  padding: 8px 14px;
  font-weight: 600;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  cursor: pointer;
}
.sidebar-cta:hover { filter: brightness(1.05); }
.sidebar-heading {
  margin: 0 0 4px;
  color: #8E8FAC;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.sidebar-empty { color: #6e6f8c; font-size: 11px; padding: 6px 0; }
.sidebar-runs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.sidebar-run {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  color: #C8CADB;
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 10px;
  cursor: pointer;
  word-break: break-all;
}
.sidebar-run:hover { background: #2A2A47; border-color: #4a4a6a; }
.sidebar-run.selected { background: var(--gold-dim); color: #1F1F33; border-color: var(--gold); }

/* ---------- Phase 2: landing / SubmitForm ---------- */
.shell-landing {
  display: grid;
  grid-template-columns: auto 1fr;
  min-height: 100vh;
  background: var(--bg);
}
.landing {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 64px 24px;
}
.landing-card {
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border: 1.5px solid var(--border);
}
.landing-head {
  padding: 28px 32px 20px;
  border-bottom: 1.5px solid var(--border);
}
.landing-mark {
  margin: 0 0 8px;
  color: var(--gold);
  font-size: 20px;
  letter-spacing: 0.22em;
  font-weight: 700;
}
.landing-sub {
  margin: 0;
  color: var(--text-2);
  font-size: 12px;
  line-height: 1.6;
  max-width: 520px;
}
.submit-form {
  padding: 24px 32px 28px;
  display: grid;
  gap: 18px;
}
.submit-form .form-row { display: grid; gap: 6px; }
.submit-form .form-label {
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-2);
  font-weight: 600;
}
.submit-form .form-select,
.submit-form .form-textarea {
  font: inherit;
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border-2);
  padding: 10px 12px;
  border-radius: 0;
}
.submit-form .form-select:focus,
.submit-form .form-textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  border-color: var(--gold);
}
.submit-form .form-textarea { resize: vertical; min-height: 60px; }
.submit-form .form-counter {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.1em;
  text-align: right;
}
.submit-form .form-loading,
.submit-form .form-empty {
  color: var(--text-3);
  font-size: 11.5px;
  padding: 6px 0;
}
.submit-form .form-empty code { background: var(--surface-2); padding: 1px 6px; }
.submit-form .form-error {
  color: var(--brick);
  font-size: 12px;
  border-left: 3px solid var(--brick);
  padding: 8px 12px;
  background: rgba(184, 92, 74, 0.1);
}
.submit-form .form-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 4px;
}
.submit-form .btn-primary {
  background: var(--gold);
  border: 1.5px solid var(--gold);
  color: #1F1F33;
  padding: 10px 22px;
  font-weight: 600;
  letter-spacing: 0.14em;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--mono);
}
.submit-form .btn-primary:disabled {
  background: var(--border);
  border-color: var(--border-2);
  color: var(--text-3);
  cursor: not-allowed;
}
.submit-form .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
.submit-form .btn-link,
.btn-link {
  background: transparent;
  border: 0;
  color: var(--gold);
  font: inherit;
  font-family: var(--mono);
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  font-size: 11px;
}
.btn-link:hover { color: var(--text); }

@media (max-width: 640px) {
  .sidebar.expanded { width: 100%; position: fixed; inset: 0; z-index: 100; }
  .shell-with-sidebar { grid-template-columns: 36px 1fr; }
  .landing { padding: 24px 12px; }
}

</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
// Concord Lite — Literature Review Assistant Run #041 fixture
window.CONCORD_DATA = {
  run: {
    id: "RUN-041",
    workflow: "LITERATURE_REVIEW_ASSISTANT",
    started: "2026-05-03T14:22:08Z",
    duration_ms: 18432,
    final_output_status: "EMITTED",
    operator: "j.kowalski",
    pattern: "AutoPattern",
    manager: "GroupChatManager",
    task: "Concise literature review on whether multi-agent systems improve reliability in research workflows."
  },
  stats: {
    violations: 4,
    agents_run: 5,
    repair_ready: 4,
    contracts_total: 5,
    contracts_passed: 1,
    events_total: 12,
    tool_events: 1
  },
  cost: {
    daytona_seconds: 4.128,
    llm_tokens: 0,
    llm_cost_usd: 0,
    daytona_cost_usd: 0.0008256
  },
  agents: [
    { id: "RES", name: "ResearcherAgent",  steps: 3, status: "PASS", note: "tavily_search x1" },
    { id: "CRT", name: "CriticAgent",      steps: 2, status: "PASS", note: "3 critique notes" },
    { id: "VRF", name: "VerifierAgent",    steps: 2, status: "FAIL", note: "no tool_event" },
    { id: "RPT", name: "ReporterAgent",    steps: 2, status: "FAIL", note: "verified=0" },
    { id: "ACT", name: "ActionAgent",      steps: 1, status: "FAIL", note: "approval=pending" }
  ],
  // ---------------------------------------------------------------
  // topology — declared workflow shape; this is what the operator wrote
  // into the AG2 builder. The DAG screen renders this and overlays the
  // observed trace on top, surfacing ROUTING violations structurally.
  //
  // Schema (stable contract for backend):
  //   topology.nodes[]: { id, name, role, kind, contracts[] }
  //     kind: "agent" | "tool" | "gate" | "manager"
  //     contracts: contract ids that are bound to this node
  //   topology.edges[]: { from, to, kind, condition?, declared, expected_tool_event? }
  //     kind: "handoff" | "tool_call" | "side_effect" | "approval"
  //     declared: whether this edge exists in the user's program
  //     condition: optional human-readable AG2 OnContextCondition expr
  //   topology.entry: node id where the run starts
  // ---------------------------------------------------------------
  topology: {
    entry: "MGR",
    nodes: [
      { id: "MGR", name: "GroupChatManager", role: "manager",  kind: "manager", contracts: ["C-RTE"] },
      { id: "RES", name: "ResearcherAgent",  role: "research", kind: "agent",   contracts: [] },
